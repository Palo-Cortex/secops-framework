# ============================================================================
# Microsoft Purview Data Loss Prevention — Microsoft Graph Security Alerts
# Vendor pack mapping (one file per data source)
# ============================================================================
# Third product-scoped contract on msft_graph_security_alerts_raw. Partition:
#   MDE : productName in ("Microsoft Defender for Endpoint", "Microsoft Defender XDR")
#   MDO : serviceSource = "microsoftDefenderForOffice365"
#   DLP : serviceSource = "dataLossPrevention"
# The Graph feed carries Purview DLP *alerts* (policy-match alerts raised by
# alert policies) — alert-shaped, with user/file/message/cloud-app evidence.
# Do not confuse with msft_o365_dlp_raw, the per-rule-match audit stream.
#
# Grounded in the ac tenant survey (2026-09-14). Observed (30d, aggregate):
#   1,613 alerts, category [Exfiltration], severity [low, medium, high],
#   detectionSource [microsoftDataLossPrevention], evidence types:
#   fileEvidence, userEvidence, analyzedMessageEvidence, cloudApplicationEvidence
#
# Category DLP: the SOC Framework has no DLP workflow playbooks yet. This
# contract normalizes and routes; the DLP lifecycle content is separate work.
# ============================================================================
vendor: microsoft-purview
product: Data Loss Prevention
data_source: msft_graph_security_alerts_raw
category: DLP
pack: soc-microsoft-purview-dlp

raw_schema:

  id:                    {type: string, is_array: false}
  title:                 {type: string, is_array: false}
  description:           {type: string, is_array: false}
  category:              {type: string, is_array: false}
  severity:              {type: string, is_array: false}
  status:                {type: string, is_array: false}
  serviceSource:         {type: string, is_array: false}
  detectionSource:       {type: string, is_array: false}
  productName:           {type: string, is_array: false}
  providerAlertId:       {type: string, is_array: false}
  alertWebUrl:           {type: string, is_array: false}
  incidentId:            {type: string, is_array: false}
  tenantId:              {type: string, is_array: false}
  firstActivityDateTime: {type: string, is_array: false}
  lastActivityDateTime:  {type: string, is_array: false}
  alertPolicyId:         {type: string, is_array: false}
  mitreTechniques:       {type: json,   is_array: true}
  evidence:              {type: json,   is_array: true,
                          json_subfields: ["@odata.type",
                                           userAccount, fileDetails, mdeDeviceId, detectionStatus,
                                           recipientEmailAddress, p1Sender, subject,
                                           internetMessageId, networkMessageId, deliveryAction,
                                           attachmentsCount, displayName, saasAppId, appId,
                                           instanceName, ipAddress, hostName]}


correlation_rules:
  - subtype: passthrough
    fromversion: "6.10.0"
    global_rule_id: 'SOC Purview DLP - Policy Alert'
    name: 'SOC Purview DLP - Policy Alert'
    description: >-
      Creates an XSIAM alert for each Microsoft Purview Data Loss Prevention
      alert in the Microsoft Graph Security feed (serviceSource =
      dataLossPrevention). Parses the Graph evidence for the acting user,
      the file, the message (email DLP) and the cloud app (SharePoint /
      OneDrive / Exchange), canonicalizes the user email-first as the grouping
      pivot, and groups with Defender alerts of the same Defender incident via
      the synthetic causality id. Injects DS:Microsoft/Data Loss Prevention and
      DOM:Security so Foundation Product Classification routes to DLP.
    tags:
      - SOCFramework
      - Passthrough
      - DLP
      - MicrosoftPurview

    schema_constants:
      rule_id: 0
      alert_category: User Defined
      alert_domain: DOMAIN_SECURITY
      action: ALERTS
      execution_mode: SCHEDULED
      mapping_strategy: CUSTOM
      user_defined_category: tactic
      user_defined_severity: severity
      is_enabled: true
      drilldown_query_timeframe: ALERT
      severity: User Defined

    crontab: "*/10 * * * *"
    search_window: 20 minutes
    simple_schedule: 10 minutes
    alert_name: '$alert_name'
    alert_description: '$alert_description'

    suppression:
      enabled: true
      duration: 1 hours
      fields: [providerAlertId]
      notes: |
        providerAlertId is Graph's per-alert unique id. Hourly suppression
        absorbs back-to-back polls of the same alert.

    identity: true
    cie_join: upn_email
    cie_schedule:
      crontab: '*/10 * * * *'
      search_window: 20 minutes
      simple_schedule: 10 minutes

    pre_alter: |
      // Vendor / product (required for SOCProductCategoryMap routing)
      | alter vendor_name = "Microsoft", product_name = productName

      // ---- Scope: Purview DLP alerts only (partition with MDE / MDO rules)
      | filter serviceSource = "dataLossPrevention"
      | filter status != "resolved"

      // Tactic alias — drives user_defined_category
      | alter tactic = category

      // Severity: Graph severities are lowercase
      | alter severity = if(
              lowercase(severity) = "high",   "High",
              lowercase(severity) = "medium", "Medium",
              lowercase(severity) = "low",    "Low",
              lowercase(severity) = "informational", "Informational",
              "Low"
          )

      // MITRE — same derivation as the Defender contracts
      | alter cat_norm = replace(replace(replace(replace(lowercase(category), " ", ""), "-", ""), "_", ""), ".", "")
      | alter
          mitre_tactic          = category,
          mitre_tactic_id       = if(
              cat_norm contains "exfiltration",        "TA0010",
              cat_norm contains "collection",          "TA0009",
              cat_norm contains "initialaccess",       "TA0001",
              cat_norm contains "impact",              "TA0040",
              ""),
          mitre_technique_first = arrayindex(mitreTechniques -> [], 0),
          mitre_technique_str   = arraystring(mitreTechniques -> [], ",")

      // ---- Evidence: first element of each type
      | alter
          userEvidence    = arrayindex(arrayfilter(evidence -> [], "@element" -> ["@odata.type"] contains "userEvidence"), 0),
          fileEvidence    = arrayindex(arrayfilter(evidence -> [], "@element" -> ["@odata.type"] contains "fileEvidence"), 0),
          messageEvidence = arrayindex(arrayfilter(evidence -> [], "@element" -> ["@odata.type"] contains "analyzedMessageEvidence"), 0),
          appEvidence     = arrayindex(arrayfilter(evidence -> [], "@element" -> ["@odata.type"] contains "cloudApplicationEvidence"), 0),
          deviceEvidence  = arrayindex(arrayfilter(evidence -> [], "@element" -> ["@odata.type"] contains "deviceEvidence"), 0)

      | alter
          evidence_user_upn     = userEvidence -> userAccount.userPrincipalName,
          evidence_user_sid     = userEvidence -> userAccount.userSid,
          evidence_user_display = userEvidence -> userAccount.displayName,
          evidence_user_domain  = userEvidence -> userAccount.domainName,
          evidence_user_sam     = userEvidence -> userAccount.accountName

      | alter
          dlp_file_name     = fileEvidence -> fileDetails.fileName,
          dlp_file_path     = fileEvidence -> fileDetails.filePath,
          dlp_file_sha256   = fileEvidence -> fileDetails.sha256,
          dlp_file_size     = fileEvidence -> fileDetails.fileSize,
          dlp_file_device   = fileEvidence -> mdeDeviceId,
          dlp_file_action   = fileEvidence -> detectionStatus

      | alter
          dlp_recipient     = messageEvidence -> recipientEmailAddress,
          dlp_sender        = messageEvidence -> p1Sender.emailAddress,
          dlp_subject       = messageEvidence -> subject,
          dlp_internet_msg  = messageEvidence -> internetMessageId,
          dlp_network_msg   = messageEvidence -> networkMessageId,
          dlp_delivery      = messageEvidence -> deliveryAction,
          dlp_attachments   = messageEvidence -> attachmentsCount

      | alter
          dlp_app_name      = appEvidence -> displayName,
          dlp_app_instance  = appEvidence -> instanceName,
          dlp_app_id        = appEvidence -> saasAppId,
          dlp_device_host   = deviceEvidence -> hostName,
          dlp_device_id     = deviceEvidence -> mdeDeviceId

      // ---- Identity: the acting user, email-first. For email DLP the sender
      //      (an internal user) is the actor; the recipient is the destination.
      | alter acting_user = lowercase(coalesce(evidence_user_upn, dlp_sender))
      | alter user_principal = acting_user
      | alter user_name      = coalesce(acting_user, evidence_user_sam)
      | alter display_name   = evidence_user_display
      | alter actor_effective_username = acting_user

      // Cross-rule grouping: same synthetic causality as MDE / MDO365
      | alter causality_synth = if(incidentId != null, concat("msgraph-incident-", to_string(incidentId)), null)

      // Title: [DLP] {user} - {tactic}: {policy alert title}
      | alter alert_name = concat(
              "[DLP] ",
              coalesce(acting_user, "Unknown User"),
              " - ",
              coalesce(category, "Policy Match"),
              ": ",
              coalesce(title, "Purview DLP alert")
          )

      | alter alert_description = concat(
              coalesce(description, "Microsoft Purview DLP policy alert"),
              " | User: ",      coalesce(acting_user, "Unknown"),
              " | App: ",       coalesce(dlp_app_name, dlp_app_instance, "-"),
              " | File: ",      coalesce(dlp_file_name, "-"),
              " | Recipient: ", coalesce(dlp_recipient, "-"),
              " | Subject: ",   coalesce(dlp_subject, ""),
              " | Severity: ",  coalesce(severity, "Unknown")
          )

      // ============================================================
      // CANONICAL CORE NORMALIZATION
      // ============================================================
      | alter
              vendor                               = vendor_name,
              product                              = product_name,
              originalalertid                      = providerAlertId,
              originalalertname                    = alert_name,
              originalalertsource                  = productName,
              externallink                         = alertWebUrl,
              severity                             = severity,
              mitretacticid                        = mitre_tactic_id,
              mitretacticname                      = mitre_tactic,
              mitretechniqueid                     = mitre_technique_first,
              mitretechniquename                   = mitre_technique_str,
              agent_hostname                       = dlp_device_host,
              agent_id                             = coalesce(dlp_device_id, dlp_file_device),
              agent_device_domain                  = evidence_user_domain,
              actor_process_image_name             = null,
              actor_process_image_path             = null,
              actor_process_image_sha256           = null,
              actor_process_command_line           = null,
              actor_process_os_pid                 = null,
              causality_actor_process_image_name   = null,
              causality_actor_process_image_path   = null,
              causality_actor_process_image_sha256 = null,
              action_file_name                     = dlp_file_name,
              action_file_path                     = dlp_file_path,
              action_file_sha256                   = dlp_file_sha256,
              action_local_ip                      = null,
              action_remote_ip                     = null

      // ---- DLP surface + email parity fields
      | alter
              dlp_alert_policy_id        = alertPolicyId,
              dlp_incident_id            = to_string(incidentId),
              dlp_first_activity         = firstActivityDateTime,
              dlp_last_activity          = lastActivityDateTime,
              emailmessageid             = dlp_internet_msg,
              fw_email_recipient         = dlp_recipient,
              fw_email_sender            = dlp_sender,
              fw_email_subject           = dlp_subject,
              socfwemaildeliveryaction   = dlp_delivery

      // Tag injection — DS:Microsoft/Data Loss Prevention → ds_microsoft_data_loss_prevention
      | alter alert_tags = arraycreate("DS:Microsoft/Data Loss Prevention", "DOM:Security")

    final_projection:
      - _time
      - incidentId
      - productName
      - vendor_name
      - product_name
      - title
      - description
      - severity
      - status
      - tactic
      - category
      - alertWebUrl
      - providerAlertId
      - alertPolicyId
      - mitreTechniques
      - mitre_tactic
      - mitre_tactic_id
      - mitre_technique_first
      - mitre_technique_str
      - acting_user
      - user_principal
      - user_name
      - display_name
      - evidence_user_upn
      - evidence_user_sid
      - evidence_user_sam
      - evidence_user_domain
      - causality_synth
      - dlp_file_name
      - dlp_file_path
      - dlp_file_sha256
      - dlp_file_size
      - dlp_file_device
      - dlp_file_action
      - dlp_recipient
      - dlp_sender
      - dlp_subject
      - dlp_internet_msg
      - dlp_network_msg
      - dlp_delivery
      - dlp_attachments
      - dlp_app_name
      - dlp_app_instance
      - dlp_app_id
      - dlp_device_host
      - dlp_device_id
      - dlp_alert_policy_id
      - dlp_incident_id
      - dlp_first_activity
      - dlp_last_activity
      - alert_name
      - alert_description
      - alert_tags
      - '*'

    alert_fields:

      # === CANONICAL CORE ===
      - {issue_field: vendor, source: vendor, bucket: computed}
      - {issue_field: product, source: product, bucket: computed}
      - {issue_field: originalalertid, source: originalalertid, bucket: computed}
      - {issue_field: originalalertname, source: originalalertname, bucket: computed}
      - {issue_field: originalalertsource, source: originalalertsource, bucket: computed}
      - {issue_field: externallink, source: externallink, bucket: computed}
      - {issue_field: alert_description, source: alert_description, bucket: computed}
      - {issue_field: severity, source: severity, bucket: computed}
      - {issue_field: mitretacticid, source: mitretacticid, bucket: computed}
      - {issue_field: mitretacticname, source: mitretacticname, bucket: computed}
      - {issue_field: mitretechniqueid, source: mitretechniqueid, bucket: computed}
      - {issue_field: mitretechniquename, source: mitretechniquename, bucket: computed}
      - {issue_field: agent_hostname, source: agent_hostname, bucket: computed}
      - {issue_field: agent_id, source: agent_id, bucket: computed}
      - {issue_field: agent_device_domain, source: agent_device_domain, bucket: computed}
      - {issue_field: actor_effective_username, source: actor_effective_username, bucket: computed}
      - {issue_field: action_file_name, source: action_file_name, bucket: computed}
      - {issue_field: action_file_path, source: action_file_path, bucket: computed}
      - {issue_field: action_file_sha256, source: action_file_sha256, bucket: computed}

      # === Grouping pivots / cliName aliases ===
      - {issue_field: user_principal,               source: user_principal,   bucket: computed}
      - {issue_field: userid,                       source: user_principal,   bucket: computed}
      - {issue_field: usersid,                      source: evidence_user_sid, bucket: computed}
      - {issue_field: samaccountname,               source: evidence_user_sam, bucket: computed}
      - {issue_field: username,                     source: actor_effective_username, bucket: computed}
      - {issue_field: causality_actor_causality_id, source: causality_synth,  bucket: computed}
      - {issue_field: xdmsourceprocesscausalityid,  source: causality_synth,  bucket: computed}
      - {issue_field: hostname,                     source: agent_hostname,   bucket: computed}
      - {issue_field: agentid,                      source: agent_id,         bucket: computed}
      - {issue_field: filename,                     source: action_file_name, bucket: computed}
      - {issue_field: filepath,                     source: action_file_path, bucket: computed}
      - {issue_field: filesha256,                   source: action_file_sha256, bucket: computed}
      - {issue_field: socfwidentityuserdisplayname, source: idr_display_name, bucket: cie}

      # === Email parity (email-channel DLP) ===
      - {issue_field: emailmessageid,           source: emailmessageid,           bucket: computed}
      - {issue_field: fw_email_recipient,       source: fw_email_recipient,       bucket: computed}
      - {issue_field: fw_email_sender,          source: fw_email_sender,          bucket: computed}
      - {issue_field: fw_email_subject,         source: fw_email_subject,         bucket: computed}
      - {issue_field: emailsource,              source: fw_email_sender,          bucket: computed}
      - {issue_field: socfwemaildeliveryaction, source: socfwemaildeliveryaction, bucket: computed}

      # === DLP surface ===
      - {issue_field: dlp_alert_policy_id,  source: dlp_alert_policy_id,  bucket: computed}
      - {issue_field: dlp_incident_id,      source: dlp_incident_id,      bucket: computed}
      - {issue_field: dlp_first_activity,   source: dlp_first_activity,   bucket: computed}
      - {issue_field: dlp_last_activity,    source: dlp_last_activity,    bucket: computed}
      - {issue_field: dlp_app_name,         source: dlp_app_name,         bucket: computed}
      - {issue_field: dlp_app_instance,     source: dlp_app_instance,     bucket: computed}
      - {issue_field: dlp_app_id,           source: dlp_app_id,           bucket: computed}
      - {issue_field: dlp_file_size,        source: dlp_file_size,        bucket: computed}
      - {issue_field: dlp_file_action,      source: dlp_file_action,      bucket: computed}
      - {issue_field: dlp_recipient,        source: dlp_recipient,        bucket: computed}
      - {issue_field: dlp_attachments,      source: dlp_attachments,      bucket: computed}

      # === Tags ===
      - {issue_field: tags,       source: alert_tags, bucket: computed}
      - {issue_field: alert_name, source: alert_name, bucket: computed}

    mitre_defs: {}

    investigation_query_link: |-
      // Other Graph alerts from the same Defender incident
      dataset = msft_graph_security_alerts_raw
      | filter incidentId = $incidentId
      | fields _time, productName, serviceSource, title, severity, status

    contributes:
      - User
      - User.UPN
      - User.SID
      - User.SAM
      - User.DisplayName
      - Endpoint.Hostname
      - Endpoint.AgentID
      - Target.File
      - Target.Path
      - Target.SHA256
      - Email.Recipient
      - Email.Sender
      - Email.Subject
      - Email.MessageID
      - Email.DeliveryAction
      - MITRE.Tactic
      - MITRE.TacticID
      - MITRE.Technique
      - MITRE.TechniqueID
