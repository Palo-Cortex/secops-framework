# ============================================================
# SOC Framework - Abnormal Security (Inbound Email) contract
# Correlation-only email vendor pack. Modeled on proofpoint-tap-threats.yaml.
# Email-first identity, URL-domain grouping artifact, MITRE Initial Access.
# ============================================================

vendor: abnormal-security
product: Email Protection
data_source: abnormal_security_email_protection_raw
category: Email
pack: SocFrameworkAbnormalSecurity

raw_schema:
  # Identifiers
  abxMessageId:      {type: string,   is_array: false}
  abxMessageIdStr:   {type: string,   is_array: false}
  threatId:          {type: string,   is_array: false}
  internetMessageId: {type: string,   is_array: false}
  # Sender
  fromAddress:       {type: string,   is_array: false}
  fromName:          {type: string,   is_array: false}
  senderDomain:      {type: string,   is_array: false}
  senderIpAddress:   {type: string,   is_array: false}
  returnPath:        {type: string,   is_array: false}
  replyToEmails:     {type: string,   is_array: false}
  # Recipient
  recipientAddress:  {type: string,   is_array: false}
  toAddresses:       {type: string,   is_array: false}
  ccEmails:          {type: string,   is_array: false}
  # Content
  subject:           {type: string,   is_array: false}
  urls:              {type: string,   is_array: false}
  links:             {type: string,   is_array: false}
  urlCount:          {type: int,      is_array: false}
  attachmentCount:   {type: int,      is_array: false}
  attachmentNames:   {type: string,   is_array: false}
  summaryInsights:   {type: string,   is_array: false}
  # Abnormal attack taxonomy
  attackType:        {type: string,   is_array: false}
  attackVector:      {type: string,   is_array: false}
  attackStrategy:    {type: string,   is_array: false}
  attackedParty:     {type: string,   is_array: false}
  impersonatedParty: {type: string,   is_array: false}
  # Remediation posture
  remediationStatus:    {type: string,   is_array: false}
  remediationTimestamp: {type: datetime, is_array: false}
  autoRemediated:       {type: string,   is_array: false}
  postRemediated:       {type: string,   is_array: false}
  # Console
  abxPortalUrl:      {type: string,   is_array: false}
  receivedTime:      {type: datetime, is_array: false}
  sentTime:          {type: datetime, is_array: false}

correlation_rules:

  - subtype: passthrough
    fromversion: "6.10.0"
    global_rule_id: 'SOC Abnormal Security - Threat Detected All Alerts'
    name: 'SOC Abnormal Security - Threat Detected All Alerts'
    description: >-
      Unified Abnormal Security inbound-email detection rule. Fires on any
      Abnormal attack verdict (attackType populated). Suppression is per
      abxMessageId to preserve full blast-radius visibility across recipients.
      Email-only vendor: host/process fields are null. Cross-rule grouping
      pivots against endpoint/identity sources: actor_effective_username
      (lowercase recipient email/UPN), user_principal (parallel), and the URL
      registered domain via fw_url_domain / dns_query_name (matches the
      endpoint's DNS/C2 domain artifact). Abnormal's threat log carries no
      attachment hashes, so action_file_sha256 is null by design.
      Username normalization: lowercase, email-first. Lowercase is mandatory --
      exact-equality grouping makes casing a silent pivot-killer.
    tags:
      - SOCFramework
      - Detection
      - Email
      - AbnormalSecurity
      - T1566

    schema_constants:
      rule_id: 0
      alert_category: User Defined
      alert_domain: DOMAIN_SECURITY
      action: ALERTS
      execution_mode: SCHEDULED
      mapping_strategy: CUSTOM
      user_defined_category: alert_category
      user_defined_severity: alert_severity
      is_enabled: true
      drilldown_query_timeframe: ALERT
      severity: User Defined

    crontab: "*/10 * * * *"
    search_window: 20 minutes
    simple_schedule: 10 minutes
    alert_name: '$alert_name'
    alert_description: '$alert_description'

    # CIE (Cloud Identity Engine) enrichment. Ships with the socfw_identity_map
    # join OFF (preserved /* */ block). cie_join: upn_email resolves on
    # recipient_email, which pre_alter sets below. Enabling = flip to SCHEDULED
    # (already SCHEDULED here) + delete the wrapper. The overlay OVERWRITES the
    # idr_* fields the body already seeded from the raw recipient -- it never
    # creates them, so the rule resolves an email-first actor with CIE OFF.
    cie_schedule:
      crontab: '*/10 * * * *'
      search_window: 25 hours
      simple_schedule: 10 minutes
    cie_overlay: |
      // Only act on events ingested in the last 15 minutes. The 25h search_window
      // exists so the socfw_identity_map join can see the daily snapshot.
      | filter timestamp_diff(time_frame_end(), _insert_time, "MINUTE") <= 15

      // Resolve the recipient to their full directory record. Abnormal gives an
      // email address; the map gives back DOMAIN\user so actor_effective_username
      // matches what the endpoint sources emit for the same person. External
      // senders and guests will not match, which is correct.
      | alter idu_join_key = recipient_email
      | join type = left (
          dataset = socfw_identity_map
          | filter type = "user"
          | alter idu_join_key = lowercase(coalesce(upn, email))
          | dedup idu_join_key by asc netbios_and_sam_account_name
          | fields idu_join_key,
                   netbios_and_sam_account_name as idu_netbios,
                   display_name                 as idu_display_name,
                   email                        as idu_email,
                   upn                          as idu_upn,
                   sid                          as idu_sid,
                   on_prem_sid                  as idu_on_prem_sid,
                   domain_name                  as idu_domain_name,
                   sam_account_name             as idu_sam_account_name
        ) as idu idu_join_key = idu.idu_join_key
      | alter idr_netbios          = coalesce(idu_netbios, idr_netbios),
              idr_display_name     = coalesce(idu_display_name, idr_display_name),
              idr_email            = coalesce(idu_email, idu_upn, idr_email),
              idr_upn              = coalesce(idu_upn, idr_upn),
              idr_sid              = coalesce(idu_sid, idr_sid),
              idr_on_prem_sid      = coalesce(idu_on_prem_sid, idr_on_prem_sid),
              idr_domain_name      = coalesce(idu_domain_name, idr_domain_name),
              idr_sam_account_name = coalesce(idu_sam_account_name, idr_sam_account_name)

      | alter idr_netbios = coalesce(
              idr_netbios,
              if(idr_sam_account_name != null and idr_domain_name != null,
                 concat(idr_domain_name, "\\", idr_sam_account_name), null))

      | alter actor_effective_username = lowercase(coalesce(idr_email, idr_upn, idr_netbios, recipient_first))
      | alter display_name = coalesce(idr_display_name, recipient_first)
      | alter alert_description = description,
              user_principal    = coalesce(idr_upn, recipient_first),
              user_name         = actor_effective_username

    suppression:
      enabled: true
      duration: 24 hours
      fields: [abxMessageId]
      notes: |
        abxMessageId is unique per delivered message per recipient. A campaign
        to N recipients generates N distinct ids, so suppression scopes to a
        single message only -- zero effect on any other recipient's alert.

    pre_alter: |
      // Vendor / product drive SOCProductCategoryMap routing downstream.
      | alter vendor_name = "Abnormal Security", product_name = "Email Protection"

      // Fire only on a real Abnormal verdict. Blank attackType = no threat.
      | filter attackType != null and attackType != ""

      // Recipient: Abnormal ships a scalar recipientAddress plus a toAddresses
      // JSON array. Prefer the scalar, fall back to the first array address.
      | alter recipient_first = coalesce(
              recipientAddress,
              arrayindex(regextract(to_string(toAddresses), "([\w.%+-]+@[\w.-]+)"), 0))
      | alter recipient_local = lowercase(arrayindex(regextract(coalesce(recipient_first, ""), "([\w.%+-]+)@"), 0))
      | alter recipient_email = lowercase(recipient_first)

      // urls is a JSON array of URL strings. Pull the first and derive its
      // registered domain -- this is the cross-product grouping artifact that
      // matches the endpoint source's DNS/C2 domain. Empty array => null domain.
      | alter urls_str  = to_string(urls)
      | alter first_url = coalesce(
              arrayindex(json_extract_array(urls_str, "$."), 0),
              arrayindex(regextract(urls_str, "(https?://[^\"\s\]]+)"), 0))
      | alter url_domain = extract_url_registered_domain(first_url)
      | alter domain   = url_domain,
              dns_name = url_domain
      | alter cleaned_url = ltrim(replex(coalesce(first_url, ""), "^https?://", ""), "www.")

      // Delivery / remediation posture. Abnormal auto-remediates; a remediated
      // message was still delivered to the mailbox before pull-back.
      | alter delivery_action = if(
              remediationStatus in ("Remediated", "Auto-Remediated", "Manually Remediated"),
              "remediated", "delivered")
      | alter direction = "inbound"

      // Abnormal attack taxonomy surfaced for the analyst.
      | alter threat_type           = coalesce(attackVector, ""),
              threat_classification = coalesce(attackType, ""),
              threat_strategy       = coalesce(attackStrategy, "")

      // MITRE technique derived from delivery vector. Inbound email is
      // categorically Initial Access (TA0001); the sub-technique varies by how
      // the threat is delivered.
      | alter email_technique_id = if(
              lowercase(coalesce(attackVector, "")) = "link", "T1566.002",
              lowercase(coalesce(attackVector, "")) = "attachment", "T1566.001",
              "T1566"),
              email_technique_name = if(
              lowercase(coalesce(attackVector, "")) = "link", "Phishing: Spearphishing Link",
              lowercase(coalesce(attackVector, "")) = "attachment", "Phishing: Spearphishing Attachment",
              "Phishing")

      | alter alert_severity = if(
              lowercase(coalesce(attackType, "")) in ("malware", "phishing", "credential phishing", "extortion", "bec", "invoice/payment fraud", "social engineering (bec)"),
              "SEV_040_HIGH",
              lowercase(coalesce(attackType, "")) in ("spam", "graymail", "reconnaissance", "promotion"),
              "SEV_020_LOW",
              "SEV_030_MEDIUM")
      | alter alert_category = "Email Security"
      | alter alert_name = concat("[Email] ", coalesce(recipient_first, "Unknown"), " - Initial Access: ", coalesce(attackType, "Threat"), " Email Detected")
      | alter alert_type = concat("Abnormal Security - ", coalesce(attackType, "Threat"))

      // Attachment names only -- Abnormal's threat log carries no file hashes.
      | alter action_filenames = arraystring(json_extract_array(to_string(attachmentNames), "$."), ", ")

      // Identity from the recipient alone (email-first). The CIE block above
      // overwrites these from socfw_identity_map when enabled; with it commented
      // the rule still resolves an email-first actor.
      | alter idr_email            = recipient_email,
              idr_upn              = null,
              idr_netbios          = null,
              idr_display_name     = null,
              idr_sid              = null,
              idr_on_prem_sid      = null,
              idr_domain_name      = null,
              idr_sam_account_name = recipient_local

      | alter actor_effective_username = lowercase(coalesce(idr_email, idr_upn, idr_netbios, recipient_first))
      | alter display_name = coalesce(idr_display_name, recipient_first)

      | alter description = concat("Abnormal Security detection: ", coalesce(attackType, ""), " / ", coalesce(attackVector, ""), " | Recipient: ", coalesce(recipient_first, "Unknown"), " | Sender: ", coalesce(fromAddress, ""), " | URL Domain: ", coalesce(url_domain, ""), " | Strategy: ", coalesce(attackStrategy, ""), " | Remediation: ", coalesce(remediationStatus, ""), " -- MsgId: ", coalesce(abxMessageIdStr, abxMessageId))

      // The 29 canonical core columns. Email-only: host/process null.
      // agent_device_domain is null on purpose -- it is the AD machine domain;
      // the URL registered domain rides fw_url_domain instead.
      | alter
              vendor                              = vendor_name,
              product                             = product_name,
              originalalertid                     = coalesce(threatId, abxMessageIdStr, abxMessageId),
              originalalertname                   = alert_name,
              originalalertsource                 = "Abnormal Security",
              externallink                        = abxPortalUrl,
              alert_description                   = description,
              severity                            = alert_severity,
              mitretacticid                       = "TA0001",
              mitretacticname                     = "Initial Access",
              mitretechniqueid                    = email_technique_id,
              mitretechniquename                  = email_technique_name,
              agent_hostname                      = null,
              agent_id                            = null,
              agent_device_domain                 = null,
              actor_process_image_name            = null,
              actor_process_image_path            = null,
              actor_process_image_sha256          = null,
              actor_process_command_line          = null,
              actor_process_os_pid                = null,
              causality_actor_process_image_name  = null,
              causality_actor_process_image_path  = null,
              causality_actor_process_image_sha256 = null,
              action_file_name                    = action_filenames,
              action_file_path                    = null,
              action_file_sha256                  = null,
              action_local_ip                     = null,
              action_remote_ip                    = null

      // user_principal carries the recipient as a parallel grouping pivot.
      | alter user_principal = coalesce(idr_upn, recipient_first)
      | alter user_name      = actor_effective_username

    alert_fields:

      # === CANONICAL CORE - identical across every vendor pack ===
      - {issue_field: vendor, source: vendor, bucket: computed}
      - {issue_field: product, source: product, bucket: computed}
      - {issue_field: originalalertid, source: originalalertid, bucket: computed}
      - {issue_field: originalalertname, source: originalalertname, bucket: computed}
      - {issue_field: originalalertsource, source: originalalertsource, bucket: computed}
      - {issue_field: externallink, source: externallink, bucket: computed}
      - {issue_field: alert_description, source: alert_description, bucket: computed}
      - {issue_field: severity, source: severity, bucket: computed}
      - {issue_field: mitretacticid, source: mitretacticid, bucket: computed}
      - {issue_field: mitretacticname, source: mitretacticname, bucket: computed}
      - {issue_field: mitretechniqueid, source: mitretechniqueid, bucket: computed}
      - {issue_field: mitretechniquename, source: mitretechniquename, bucket: computed}
      - {issue_field: agent_hostname, source: agent_hostname, bucket: computed}
      - {issue_field: agent_id, source: agent_id, bucket: computed}
      - {issue_field: agent_device_domain, source: agent_device_domain, bucket: computed}
      - {issue_field: actor_effective_username, source: actor_effective_username, bucket: computed}
      - {issue_field: actor_process_image_name, source: actor_process_image_name, bucket: computed}
      - {issue_field: actor_process_image_path, source: actor_process_image_path, bucket: computed}
      - {issue_field: actor_process_image_sha256, source: actor_process_image_sha256, bucket: computed}
      - {issue_field: actor_process_command_line, source: actor_process_command_line, bucket: computed}
      - {issue_field: actor_process_os_pid, source: actor_process_os_pid, bucket: computed}
      - {issue_field: causality_actor_process_image_name, source: causality_actor_process_image_name, bucket: computed}
      - {issue_field: causality_actor_process_image_path, source: causality_actor_process_image_path, bucket: computed}
      - {issue_field: causality_actor_process_image_sha256, source: causality_actor_process_image_sha256, bucket: computed}
      - {issue_field: action_file_name, source: action_file_name, bucket: computed}
      - {issue_field: action_file_path, source: action_file_path, bucket: computed}
      - {issue_field: action_file_sha256, source: action_file_sha256, bucket: computed}
      - {issue_field: action_local_ip, source: action_local_ip, bucket: computed}
      - {issue_field: action_remote_ip, source: action_remote_ip, bucket: computed}

      # === VENDOR-SPECIFIC TAIL ===
      # Cross-rule grouping pivot (parallel to actor_effective_username).
      - {issue_field: user_principal, source: user_principal, bucket: computed}

      # URL domain grouping artifact - the Email<->Endpoint bridge.
      - {issue_field: dns_query_name, source: dns_name, bucket: computed}
      - {issue_field: fw_url_domain, source: domain, bucket: computed}

      # XSIAM email-class issue fields
      - {issue_field: emailmessageid, source: internetMessageId, bucket: raw}
      - {issue_field: emailsenderip, source: senderIpAddress, bucket: raw}
      - {issue_field: emailsource, source: fromAddress, bucket: raw}
      - {issue_field: fw_email_recipient, source: recipientAddress, bucket: raw}
      - {issue_field: fw_email_sender, source: fromAddress, bucket: raw}
      - {issue_field: fw_email_subject, source: subject, bucket: raw}
      - {issue_field: clickedurls, source: cleaned_url, bucket: computed, notes: 'Cleaned URL for downstream proxy/firewall correlation'}

      # SOC Framework email fields - read by Foundation_-_Normalize_Email_V3
      - {issue_field: socfwemaildeliveryaction, source: delivery_action, bucket: computed}
      - {issue_field: socfwemaildirection, source: direction, bucket: computed}
      - {issue_field: socfwemailthreaturl, source: cleaned_url, bucket: computed}
      - {issue_field: socfwemailthreattype, source: threat_type, bucket: computed}
      - {issue_field: socfwemailthreatstatus, source: remediationStatus, bucket: raw}
      - {issue_field: socfwemailthreatid, source: threatId, bucket: raw}
      - {issue_field: socfwemailclassification, source: threat_classification, bucket: computed}

      # Abnormal-specific raw surfacing
      - {issue_field: abnormalsecurityattacktype, source: attackType, bucket: raw}
      - {issue_field: abnormalsecurityattackvector, source: attackVector, bucket: raw}
      - {issue_field: abnormalsecurityattackstrategy, source: attackStrategy, bucket: raw}
      - {issue_field: abnormalsecurityattackedparty, source: attackedParty, bucket: raw}
      - {issue_field: abnormalsecurityimpersonatedparty, source: impersonatedParty, bucket: raw}
      - {issue_field: abnormalsecuritysenderdomain, source: senderDomain, bucket: raw}
      - {issue_field: abnormalsecuritysenderip, source: senderIpAddress, bucket: raw}
      - {issue_field: abnormalsecurityfromname, source: fromName, bucket: raw}
      - {issue_field: abnormalsecuritymessageid, source: abxMessageIdStr, bucket: raw}
      - {issue_field: abnormalsecurityremediationstatus, source: remediationStatus, bucket: raw}
      - {issue_field: abnormalsecurityremediationtimestamp, source: remediationTimestamp, bucket: raw}
      - {issue_field: abnormalsecurityurlcount, source: urlCount, bucket: raw}
      - {issue_field: abnormalsecurityattachmentcount, source: attachmentCount, bucket: raw}

      # === cliName CONVERGENCE - additive aliases (issue.* surface) ===
      - {issue_field: hostname, source: agent_hostname, bucket: computed}
      - {issue_field: domain, source: agent_device_domain, bucket: computed}
      - {issue_field: username, source: actor_effective_username, bucket: computed}
      - {issue_field: filename, source: action_file_name, bucket: computed}
      - {issue_field: filesha256, source: action_file_sha256, bucket: computed}
      - {issue_field: localip, source: action_local_ip, bucket: computed}
      - {issue_field: remoteip, source: action_remote_ip, bucket: computed}
      - {issue_field: emailrecipient, source: recipientAddress, bucket: raw}
      - {issue_field: emailsender, source: fromAddress, bucket: raw}
      - {issue_field: emailsubject, source: subject, bucket: raw}
      - {issue_field: dnsqueryname, source: dns_name, bucket: computed}

    mitre_defs: {}

    investigation_query_link: |-
      dataset = abnormal_security_email_protection_raw
      | filter abxMessageIdStr = "$originalalertid" or threatId = "$originalalertid"
      | fields *

    # Coverage commitment - Email artifact fields this rule populates.
    contributes:
      - Email.Threat.URL
      - Email.Threat.Type
      - Email.Threat.Status
      - Email.Threat.ID
      - Email.Threat.Classification
      - Email.DeliveryAction
      - Email.Direction
