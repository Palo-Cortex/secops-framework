# ============================================================================
# Darktrace — Model Breaches (NDR)
# Vendor pack mapping (one file per data source)
# ============================================================================
# Source-of-truth contract for the SOC Framework's pack content generator.
# Emits:
#   - ModelingRules/<id>/<id>.xif + .yml + _schema.json   (from modeling_rule)
#   - CorrelationRules/<n>.yml                            (one per correlation_rules entry)
#
# Grounded in a SHAPE-ONLY profile of a reference tenant's darktrace_darktrace_raw
# (2026-09-22, 185 leaf fields, 50 events). No customer values were exported;
# see input_tsv/darktrace_darktrace_raw.profile.json.
#
# What Darktrace actually emits here
# ----------------------------------
# One row per MODEL BREACH. A model is a detection definition; a breach is one
# firing of it. That distinction drives two mappings that are easy to get wrong:
#
#   pbid            per-breach id   -> originalalertid, suppression, drilldown
#   model.now.uuid  per-MODEL id    -> NEVER an id pivot. It is identical across
#                                      every breach of that model, so using it
#                                      would merge them all into one case.
#
# "device" is any monitored entity, not necessarily a host: a workstation, or a
# SaaS account (device.typelabel = "SaaS Provider", hostname carries
# "SaaS::Office365: <upn>"). Only the host-shaped case is mapped to endpoint
# pivots. The SaaS principal is recovered into the identity axis by regex on the
# whole string — 70 of 97 SaaS breaches over 30 days yield a UPN, the remaining
# 27 carry a non-UPN label and correctly extract to null.
#
# model.now vs model.then: `now` is the model's current definition, `then` is the
# definition as it stood when the breach fired. Alerts are authored from `now`
# (what an analyst sees in the UI today); `then` is drilldown context only.
#
# Scoring: Darktrace score is 0..1, percentscore is 0..100. The correlation rule
# maps percentscore onto the XSIAM ladder.
# ============================================================================
vendor: darktrace
product: Darktrace
data_source: darktrace_darktrace_raw
category: Network
pack: soc-darktrace-ndr

raw_schema:

  # ---- Breach identity / triage ----
  pbid:                {type: float,  is_array: false}
  time:                {type: float,  is_array: false}
  creationTime:        {type: float,  is_array: false}
  score:               {type: float,  is_array: false}
  percentscore:        {type: float,  is_array: false}
  acknowledged:        {type: string, is_array: false}
  commentCount:        {type: float,  is_array: false}
  breachUrl:           {type: string, is_array: false}
  did:                 {type: float,  is_array: false}

  # ---- Monitored entity ----
  device:              {type: string, is_array: false}

  # ---- Model definition (now / then) ----
  model:               {type: string, is_array: false}

  # ---- Per-metric trigger detail ----
  triggeredComponents: {type: string, is_array: true}

modeling_rule:
  fromversion: 6.10.0
  modeling_rule_id: SOC_Darktrace_ModelingRule
  modeling_rule_name: SOC Darktrace Modeling Rule
  directory_name: SOCDarktraceModelingRules
  contributes:
    - Network.LocalIP
    - Network.RemoteIP
    - Endpoint.Hostname
  fields:
    - xdm_path: xdm.event.id
      expression: to_string(pbid)
      sources: [pbid]
      issue_field: originalalertid
      notes: Per-breach id. Not model.now.uuid, which identifies the model.

    - xdm_path: xdm.alert.original_alert_id
      expression: to_string(pbid)
      sources: [pbid]

    - xdm_path: xdm.alert.name
      expression: json_extract_scalar(to_json_string(model), "$.now.name")
      sources: [model]
      issue_field: originalalertname

    - xdm_path: xdm.alert.description
      expression: json_extract_scalar(to_json_string(model), "$.now.description")
      sources: [model]
      issue_field: alert_description

    - xdm_path: xdm.alert.category
      expression: json_extract_scalar(to_json_string(model), "$.now.category")
      sources: [model]

    - xdm_path: xdm.alert.subcategory
      expression: json_extract_scalar(to_json_string(model), "$.now.behaviour")
      sources: [model]

    - xdm_path: xdm.alert.severity
      expression: to_string(percentscore)
      sources: [percentscore]
      issue_field: severity
      notes: Raw 0-100. The correlation rule maps it to the XSIAM ladder.

    # Source side: the monitored entity's own address.
    - xdm_path: xdm.source.ipv4
      expression: json_extract_scalar(to_json_string(device), "$.ip")
      sources: [device]
      issue_field: action_local_ip

    - xdm_path: xdm.source.host.hostname
      expression: |-
        if(json_extract_scalar(to_json_string(device), "$.hostname") ~= "^SaaS::",
           null,
           json_extract_scalar(to_json_string(device), "$.hostname"))
      sources: [device]
      issue_field: agent_hostname
      notes: >-
        A SaaS "device" puts "SaaS::Office365: <upn>" in hostname. That is an
        identity, not a host — nulled here rather than written into a hostname
        field, where it would break UEBA stitching.

    # The SaaS counterpart of the hostname above: when the monitored entity is
    # an account rather than a machine, its principal belongs on the user axis.
    - xdm_path: xdm.source.user.username
      expression: |-
        if(json_extract_scalar(to_json_string(device), "$.hostname") ~= "^SaaS::",
           arrayindex(regextract(json_extract_scalar(to_json_string(device), "$.hostname"),
                      "([\w.%+\-']+@[\w.\-]+\.[A-Za-z]{2,})"), 0),
           null)
      sources: [device]
      issue_field: actor_effective_username
      notes: >-
        Null for host-shaped devices. Darktrace observes traffic, not logons, so
        a machine breach genuinely has no user and an invented one would be
        worse than an empty field.

    - xdm_path: xdm.source.host.device_id
      expression: json_extract_scalar(to_json_string(device), "$.did")
      sources: [device]

    - xdm_path: xdm.source.host.os
      expression: json_extract_scalar(to_json_string(device), "$.os")
      sources: [device]

    # Target side: the connection peer from the triggered metric.
    - xdm_path: xdm.target.ipv4
      expression: json_extract_scalar(to_json_string(triggeredComponents), "$[0].ip")
      sources: [triggeredComponents]
      issue_field: action_remote_ip
      notes: >-
        The peer address on the metric that fired. NOT the monitored entity's own
        address — keeping these apart is what stops victim and peer landing in
        one field.

    - xdm_path: xdm.observer.product
      expression: '"Darktrace"'
      sources: []

    - xdm_path: xdm.observer.vendor
      expression: '"Darktrace"'
      sources: []

correlation_rules:
  - subtype: passthrough
    fromversion: 6.10.0
    global_rule_id: SOC Darktrace - Model Breach
    name: SOC Darktrace - Model Breach
    description: >-
      Reshapes Darktrace model breaches (darktrace_darktrace_raw) into
      properly-formed XSIAM alerts for the SOC Framework Network category. Maps
      the monitored entity and the triggered metric's peer to the canonical
      network pivots, percentscore to the XSIAM severity ladder, and MITRE from
      the model definition. Grouping pivots: action_local_ip (entity),
      action_remote_ip (peer), agent_hostname (host-shaped entities only),
      causality_actor_causality_id (pbid). SCOPE: Critical and Suspicious
      SCOPE: Darktrace's own Critical band only, non-compliance
      (~4 breaches / 30 days on a reference tenant, measured as DISTINCT pbid — the
      collector re-polls, so row counts overstate by several thousand times).
      Suspicious is excluded: it is Darktrace's "worth a look", and including
      it put 82 breaches / 30 days on the queue, 67 of which were Antigena
      autonomous-response records or one chatty recon model. Everything below
      Critical stays queryable in darktrace_darktrace_raw and is better used as
      enrichment on a case another source opened. Identity axis is wired
      for SaaS entities only: a SaaS "device" is an account, and its UPN is
      recovered from the hostname string into actor_effective_username and
      user_principal. Measured IN SCOPE on a reference tenant that is 8 of 82 breaches
      over 30 days — across all breaches including Informational it is 70 of
      400, but this rule does not fire on Informational and the in-scope
      number is the one that matters. Small, and still the only pivot this
      source shares with the email and identity categories. Host-shaped
      devices keep a null identity, which is correct: Darktrace observes
      traffic, not logons.
    tags: [SOCFramework, Passthrough, Network, NDR, Darktrace]

    schema_constants:
      rule_id: 0
      alert_category: User Defined
      alert_domain: DOMAIN_SECURITY
      action: ALERTS
      execution_mode: SCHEDULED
      mapping_strategy: CUSTOM
      user_defined_category: dt_category
      user_defined_severity: severity
      is_enabled: true
      drilldown_query_timeframe: ALERT
      severity: User Defined

    crontab: "*/10 * * * *"
    search_window: 20 minutes
    simple_schedule: 10 minutes

    alert_name: $alert_name
    alert_description: $alert_description

    suppression:
      enabled: true
      duration: 24 hours
      fields: [pbid]
      notes: >-
        pbid is one id per model breach and is a real top-level column, so it is
        usable for suppression (suppression resolves against the dataset, not
        against the query's alters). Daily window absorbs re-polls of a breach
        that has not been acknowledged.

    pre_alter: |-
      // Vendor / product (required for SOCProductCategoryMap routing)
      | alter vendor_name = "Darktrace", product_name = "Darktrace"

      // ========================================================================
      // DETECTION SCOPE — measured on a reference tenant
      //
      // The collector RE-POLLS open breaches: 2,819 rows in 24h resolved to
      // 11 distinct pbid (~256 rows per breach). Row counts are not detection
      // counts, and reading them as such is what made an earlier draft of this
      // filter Critical-only.
      //
      //   DISTINCT BREACHES        24h        30d
      //     Informational            9        318
      //     Suspicious               2         78
      //     Critical                 0          4
      //
      // Scope is CRITICAL only, excluding compliance models (policy findings,
      // not threats): ~4 breaches / 30d. That is deliberately rare. See the
      // model-family breakdown below for why Suspicious was dropped.
      //
      // Suppression on pbid is load-bearing, not cosmetic. Without it the
      // re-polling turns 11 breaches into 2,819 alerts a day.
      //
      // Critical never scores above 84 here while Suspicious is dominated by
      // the 85+ band, so percentscore is NOT a severity proxy. Filter on
      // category; use score only to rank within it. The severity ladder below
      // does exactly that — an earlier version mapped percentscore straight
      // onto the XSIAM scale and called 70 of 82 breaches critical.
      // ========================================================================
      | alter dt_scope_category   = json_extract_scalar(to_json_string(model), "$.now.category"),
              dt_scope_compliance = json_extract_scalar(to_json_string(model), "$.now.compliance"),
              dt_scope_model      = json_extract_scalar(to_json_string(model), "$.now.name")
      | filter dt_scope_category = "Critical"
      | filter dt_scope_compliance != "true"

      // WHY CRITICAL ONLY, and not Critical + Suspicious.
      //
      // Including Suspicious put 82 breaches / 30 days on the queue. Broken
      // out by model family that was:
      //
      //   Antigena::Network::*                              45
      //   Device::Attack and Recon Tools                    22
      //   SaaS::Access / Unusual Activity / Compromise       8
      //   Compromise::* (DGA beaconing, Tor, DNS volume)     5
      //   Device::Network Scan / Anomalous Github Download   2
      //
      // Antigena models are Darktrace's AUTONOMOUS RESPONSE firing: the
      // traffic was already blocked. They record containment that happened,
      // not a detection needing investigation. Device::Attack and Recon Tools
      // is one model producing 22 breaches, which is scanner and admin-tooling
      // behaviour rather than 22 incidents.
      //
      // Excluding those two left ~15, and they were still all Suspicious --
      // Darktrace's "worth a look", not its "act on this". Building a case
      // pipeline on another vendor's maybe is how a queue stops being read.
      //
      // So scope defers to Darktrace's own verdict and nothing else: the
      // Critical band, ~4 breaches / 30 days on a reference tenant. Rare, and meaningful
      // when it fires. Everything else stays in darktrace_darktrace_raw, fully
      // queryable, and is better used as enrichment on a case another source
      // opened than as a case of its own.
      //
      // Antigena is NOT excluded here. "Antigena Active Threat SMB Write
      // Block" is in the Critical band and is a genuine compromise signal even
      // though the traffic was stopped -- at 2 in 30 days it costs nothing and
      // the fact that autonomous response fired is worth an analyst's time.
      //
      // A customer whose estate produces a different mix should widen this in
      // their own config rather than the pack widening it for everyone.

      // ---- Model definition (authored from `now`, the current definition) ----
      | alter
          dt_model_name        = json_extract_scalar(to_json_string(model), "$.now.name"),
          dt_model_category    = json_extract_scalar(to_json_string(model), "$.now.category"),
          dt_model_behaviour   = json_extract_scalar(to_json_string(model), "$.now.behaviour"),
          dt_model_description = json_extract_scalar(to_json_string(model), "$.now.description"),
          dt_model_priority    = json_extract_scalar(to_json_string(model), "$.now.priority"),
          dt_mitre_tactic      = json_extract_scalar(to_json_string(model), "$.now.mitre.tactics[0]"),
          dt_mitre_technique   = json_extract_scalar(to_json_string(model), "$.now.mitre.techniques[0]")

      // ---- Monitored entity ----
      | alter
          dt_device_ip       = json_extract_scalar(to_json_string(device), "$.ip"),
          dt_device_hostname = json_extract_scalar(to_json_string(device), "$.hostname"),
          dt_device_did      = json_extract_scalar(to_json_string(device), "$.did"),
          dt_device_type     = json_extract_scalar(to_json_string(device), "$.typelabel"),
          dt_device_os       = json_extract_scalar(to_json_string(device), "$.os")

      // A SaaS "device" is an account, not a host. Writing "SaaS::Office365:
      // <upn>" into agent_hostname would put an identity in a hostname pivot and
      // group unrelated SaaS breaches by a string that is not a machine.
      | alter dt_is_saas = if(dt_device_hostname ~= "^SaaS::", "true", "false")
      | alter dt_hostname = if(dt_is_saas = "true", null, dt_device_hostname)

      // ...but the identity inside that string is the only cross-category
      // bridge this source has, so it is recovered rather than discarded.
      // Measured on a reference tenant over 30 days, by DISTINCT pbid:
      //
      //   host           180      ip-only        108
      //   saas-identity   97      neither         15
      //
      // of the 97 SaaS entities, 70 carry a UPN-shaped principal resolving to
      // 46 distinct identities. IN SCOPE, though — after the Critical +
      // Suspicious filter below — it is 8 breaches of 82, because SaaS
      // entities skew Informational. Verified by running this rule's emitted
      // XQL against the tenant, not inferred from the population above.
      // The other 27 SaaS entities carry a non-UPN label and
      // correctly extract to null. Extraction is by regex on the whole string
      // rather than by splitting on ":" — the provider segment varies, the
      // separator may or may not be followed by a space, and a regex that
      // finds no address returns null instead of inventing an identity from a
      // label. Three states, not two.
      | alter dt_saas_upn = if(dt_is_saas = "true",
              arrayindex(regextract(dt_device_hostname,
                         "([\w.%+\-']+@[\w.\-]+\.[A-Za-z]{2,})"), 0),
              null)

      // ---- Peer from the triggered metric ----
      | alter dt_peer_ip = json_extract_scalar(to_json_string(triggeredComponents), "$[0].ip")

      // ---- Severity: Darktrace's OWN verdict first, score only to rank
      // within it.
      //
      // The previous ladder mapped percentscore straight onto the XSIAM scale
      // and was inverted in both directions. Measured over 30 days on a reference tenant:
      //
      //   emitted severity   Darktrace category   breaches
      //   SEV_050_CRITICAL   Suspicious                 68   <-- 83% of output
      //   SEV_040_HIGH       Suspicious                  6
      //   SEV_030_MEDIUM     Suspicious                  4
      //   SEV_050_CRITICAL   Critical                    2
      //   SEV_040_HIGH       Critical                    1
      //   SEV_030_MEDIUM     Critical                    1
      //
      // Darktrace calls 3 of 82 breaches Critical; the rule called 70 of them
      // critical, and demoted two of the three real ones to Medium and High.
      // The cause is that Darktrace's bands are not score-ordered: Suspicious
      // is dominated by the 85+ band while Critical never exceeds 84 here. A
      // high percentscore means "this model fired strongly", not "this is
      // severe" -- a Suspicious model can breach at 100 and still be a
      // Suspicious finding.
      //
      // The comment above the old ladder already said "percentscore is NOT a
      // severity proxy. Filter on category; use score only to rank within it."
      // This now does that.
      | alter severity = if(
            dt_scope_category = "Critical"   and to_integer(percentscore) >= 70, "SEV_050_CRITICAL",
            dt_scope_category = "Critical",                                      "SEV_040_HIGH",
            dt_scope_category = "Suspicious" and to_integer(percentscore) >= 85, "SEV_030_MEDIUM",
            dt_scope_category = "Suspicious",                                    "SEV_020_LOW",
            "SEV_010_INFO")

      | alter dt_category = coalesce(dt_model_category, "Network")

      // ---- Analyst-facing title: [Network] <entity> - <category>: <model> ----
      // dt_saas_upn sits second: for a SaaS breach the account name is what an
      // analyst recognises, and without it the title fell through to a numeric
      // Darktrace device id.
      | alter dt_entity = coalesce(dt_hostname, dt_saas_upn, dt_device_ip,
                                   to_string(dt_device_did), "Unknown")
      | alter alert_name = concat("[Network] ", dt_entity, " - ",
                                  dt_category, ": ", coalesce(dt_model_name, "Model Breach"))

      | alter alert_description = concat(
            coalesce(dt_model_description, "Darktrace model breach"),
            " | Entity: ", dt_entity,
            " | Peer: ", coalesce(dt_peer_ip, "n/a"),
            " | Score: ", to_string(percentscore),
            " | Breach: ", to_string(pbid))

      // ---- Canonical pivots ----
      | alter
          vendor                       = vendor_name,
          product                      = product_name,
          originalalertid              = to_string(pbid),
          originalalertname            = dt_model_name,
          originalalertsource          = "Darktrace",
          externallink                 = breachUrl,
          action_local_ip              = dt_device_ip,
          action_remote_ip             = dt_peer_ip,
          agent_hostname               = dt_hostname,
          causality_actor_causality_id = to_string(pbid),
          mitretacticname              = dt_mitre_tactic,
          mitretechniqueid             = dt_mitre_technique,
          mitretacticid                = null,
          mitretechniquename           = dt_mitre_technique

      // Identity axis carries the SaaS principal when the monitored entity IS
      // an account, and stays null when it is a machine. A host-shaped device
      // has no user on a Darktrace model breach — Darktrace observes traffic,
      // not logons — so inventing one from the hostname would be worse than
      // leaving it empty. Lowercased because grouping is exact-equality and
      // casing is a silent pivot-killer.
      | alter actor_effective_username = lowercase(dt_saas_upn),
              user_principal           = dt_saas_upn

    final_projection:
      - pbid
      - time
      - percentscore
      - score
      - acknowledged
      - breachUrl
      - dt_model_name
      - dt_model_category
      - dt_model_behaviour
      - dt_model_priority
      - dt_device_ip
      - dt_device_hostname
      - dt_device_did
      - dt_device_type
      - dt_device_os
      - dt_is_saas
      - dt_saas_upn
      - dt_peer_ip
      - dt_entity
      - dt_category
      - dt_scope_category
      - dt_scope_compliance
      - dt_scope_model
      - severity
      - alert_name
      - alert_description
      - vendor
      - product
      - originalalertid
      - originalalertname
      - originalalertsource
      - externallink
      - action_local_ip
      - action_remote_ip
      - agent_hostname
      - causality_actor_causality_id
      - actor_effective_username
      - user_principal
      - mitretacticid
      - mitretacticname
      - mitretechniqueid
      - mitretechniquename

    alert_fields:
      - {issue_field: vendor,                       source: vendor,                       bucket: computed}
      - {issue_field: product,                      source: product,                      bucket: computed}
      - {issue_field: originalalertid,              source: originalalertid,              bucket: computed}
      - {issue_field: originalalertname,            source: originalalertname,            bucket: computed}
      - {issue_field: originalalertsource,          source: originalalertsource,          bucket: computed}
      - {issue_field: externallink,                 source: externallink,                 bucket: computed}
      - {issue_field: alert_description,            source: alert_description,            bucket: computed}
      - {issue_field: severity,                     source: severity,                     bucket: computed}
      - {issue_field: mitretacticid,                source: mitretacticid,                bucket: computed}
      - {issue_field: mitretacticname,              source: mitretacticname,              bucket: computed}
      - {issue_field: mitretechniqueid,             source: mitretechniqueid,             bucket: computed}
      - {issue_field: mitretechniquename,           source: mitretechniquename,           bucket: computed}
      - {issue_field: action_local_ip,              source: action_local_ip,              bucket: network}
      - {issue_field: action_remote_ip,             source: action_remote_ip,             bucket: network}
      - {issue_field: agent_hostname,               source: agent_hostname,               bucket: endpoint}
      - {issue_field: causality_actor_causality_id, source: causality_actor_causality_id, bucket: computed}
      - {issue_field: actor_effective_username,     source: actor_effective_username,     bucket: identity}
      - {issue_field: user_principal,               source: user_principal,               bucket: identity}
      - {issue_field: localip,                      source: action_local_ip,              bucket: legacy}
      - {issue_field: remoteip,                     source: action_remote_ip,             bucket: legacy}
      - {issue_field: hostname,                     source: agent_hostname,               bucket: legacy}

    mitre_defs: {}

    investigation_query_link: |-
      // Other Darktrace breaches on the same monitored entity
      dataset = darktrace_darktrace_raw
      | alter dt_did = json_extract_scalar(to_json_string(device), "$.did")
      | filter dt_did = "$dt_device_did"
      | fields _time, pbid, percentscore, model, acknowledged

    contributes:
      - Network.LocalIP
      - Network.RemoteIP
      - Endpoint.Hostname
