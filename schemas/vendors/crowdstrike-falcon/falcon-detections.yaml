modeling_rule:
  fromversion: 8.3.1
  modeling_rule_id: SOC_CrowdStrikeFalcon_ModelingRule
  modeling_rule_name: SOC CrowdStrike Falcon Modeling Rule
  directory_name: SOCCrowdStrikeFalconModelingRules
  raw_xif: |
    [MODEL: dataset=crowdstrike_falcon_event_raw]
    filter product = "epp"
    | alter
        tmp_user_name = json_extract_scalar(rawJSON, "$.user_name"),
        tmp_user_principal = json_extract_scalar(rawJSON, "$.user_principal"),
        tmp_user_id = json_extract_scalar(rawJSON, "$.user_id"),
        tmp_src_domain = json_extract_scalar(rawJSON, "$.source_account_domain"),
        tmp_src_sam = json_extract_scalar(rawJSON, "$.source_account_sam_account_name"),
        tmp_src_sid = json_extract_scalar(rawJSON, "$.source_account_object_sid"),
        tmp_tgt_account_name = json_extract_scalar(rawJSON, "$.target_account_name"),
        tmp_device_groups = json_extract_array(rawJSON, "$.device.groups"),
        tmp_device_hostname = json_extract_scalar(rawJSON, "$.device.hostname"),
        tmp_device_os = json_extract_scalar(rawJSON, "$.device.os_version"),
        tmp_device_local_ip = json_extract_scalar(rawJSON, "$.device.local_ip"),
        tmp_host_names = json_extract_array(rawJSON, "$.host_names"),
        tmp_src_ep_hostname = json_extract_scalar(rawJSON, "$.source_endpoint_host_name"),
        tmp_src_ep_ip4 = json_extract_scalar(rawJSON, "$.source_endpoint_address_ip4"),
        tmp_agent_id = json_extract_scalar(rawJSON, "$.agent_id"),
        tmp_tgt_ep_hostname = json_extract_scalar(rawJSON, "$.target_endpoint_host_name"),
        tmp_tgt_ep_sensor = json_extract_scalar(rawJSON, "$.target_endpoint_sensor_id"),
        tmp_dest_hosts = json_extract_array(rawJSON, "$.destination_hosts"),
        tmp_filename = json_extract_scalar(rawJSON, "$.filename"),
        tmp_filepath = json_extract_scalar(rawJSON, "$.filepath"),
        tmp_sha256 = json_extract_scalar(rawJSON, "$.sha256"),
        tmp_md5 = json_extract_scalar(rawJSON, "$.md5"),
        tmp_cmdline = json_extract_scalar(rawJSON, "$.cmdline"),
        tmp_local_pid = json_extract_scalar(rawJSON, "$.local_process_id"),
        tmp_parent_pid = json_extract_scalar(rawJSON, "$.parent_process_id"),
        tmp_severity = json_extract_scalar(rawJSON, "$.severity"),
        tmp_severity_name = json_extract_scalar(rawJSON, "$.severity_name"),
        tmp_name = json_extract_scalar(rawJSON, "$.name"),
        tmp_display_name = json_extract_scalar(rawJSON, "$.display_name"),
        tmp_objective = json_extract_scalar(rawJSON, "$.objective"),
        tmp_description = json_extract_scalar(rawJSON, "$.description"),
        tmp_tactic_id = json_extract_scalar(rawJSON, "$.tactic_id"),
        tmp_technique_id = json_extract_scalar(rawJSON, "$.technique_id"),
        tmp_incident_type = json_extract_scalar(rawJSON, "$.incident_type"),
        tmp_type = json_extract_scalar(rawJSON, "$.type"),
        tmp_id = json_extract_scalar(rawJSON, "$.id"),
        tmp_composite_id = json_extract_scalar(rawJSON, "$.composite_id"),
        tmp_cid = json_extract_scalar(rawJSON, "$.cid")
    | alter
        xdm.source.user.username = tmp_user_name,
        xdm.source.user.upn = tmp_user_principal,
        xdm.source.user.domain = tmp_src_domain,
        xdm.source.user.sam_account_name = tmp_src_sam,
        xdm.source.user.identifier = coalesce(tmp_user_id, tmp_src_sid),
        xdm.source.user.groups = tmp_device_groups,
        xdm.target.user.username = tmp_tgt_account_name,
        xdm.source.host.hostname = coalesce(tmp_device_hostname, arrayindex(tmp_host_names, 0), tmp_src_ep_hostname),
        xdm.source.host.device_id = tmp_agent_id,
        xdm.source.agent.identifier = tmp_agent_id,
        xdm.source.host.os = tmp_device_os,
        xdm.source.host.ipv4_addresses = arraycreate(coalesce(tmp_device_local_ip, tmp_src_ep_ip4)),
        xdm.source.ipv4 = coalesce(tmp_device_local_ip, tmp_src_ep_ip4),
        xdm.target.host.hostname = coalesce(tmp_tgt_ep_hostname, arrayindex(tmp_dest_hosts, 0)),
        xdm.target.agent.identifier = tmp_tgt_ep_sensor,
        xdm.source.process.name = tmp_filename,
        xdm.source.process.executable.path = tmp_filepath,
        xdm.source.process.executable.sha256 = tmp_sha256,
        xdm.source.process.executable.md5 = tmp_md5,
        xdm.source.process.command_line = tmp_cmdline,
        xdm.source.process.pid = to_integer(tmp_local_pid),
        xdm.source.process.parent_id = tmp_parent_pid,
        xdm.alert.severity = concat(to_string(tmp_severity), " - ", tmp_severity_name),
        xdm.alert.name = coalesce(tmp_name, tmp_display_name),
        xdm.alert.category = tmp_objective,
        xdm.alert.description = tmp_description,
        xdm.alert.mitre_tactics = arraycreate(tmp_tactic_id),
        xdm.alert.mitre_techniques = arraycreate(tmp_technique_id),
        xdm.event.type = coalesce(tmp_incident_type, tmp_type),
        xdm.event.original_event_type = tmp_incident_type,
        xdm.event.description = tmp_description,
        xdm.event.id = coalesce(tmp_id, tmp_composite_id),
        xdm.observer.vendor = "CrowdStrike",
        xdm.observer.product = "Falcon Insight",
        xdm.observer.unique_identifier = tmp_cid;
    filter product = "idp"
    | alter
        tmp_src_upn = json_extract_scalar(rawJSON, "$.source_account_upn"),
        tmp_src_account_name = json_extract_scalar(rawJSON, "$.source_account_name"),
        tmp_user_principal = json_extract_scalar(rawJSON, "$.user_principal"),
        tmp_user_name = json_extract_scalar(rawJSON, "$.user_name"),
        tmp_src_domain = json_extract_scalar(rawJSON, "$.source_account_domain"),
        tmp_src_sam = json_extract_scalar(rawJSON, "$.source_account_sam_account_name"),
        tmp_src_sid = json_extract_scalar(rawJSON, "$.source_account_object_sid"),
        tmp_tgt_account_name = json_extract_scalar(rawJSON, "$.target_account_name"),
        tmp_tgt_sid = json_extract_scalar(rawJSON, "$.target_account_object_sid"),
        tmp_src_ep_hostname = json_extract_scalar(rawJSON, "$.source_endpoint_host_name"),
        tmp_src_hosts = json_extract_array(rawJSON, "$.source_hosts"),
        tmp_host_names = json_extract_array(rawJSON, "$.host_names"),
        tmp_src_ep_guid = json_extract_scalar(rawJSON, "$.source_endpoint_account_object_guid"),
        tmp_src_ep_ip4 = json_extract_scalar(rawJSON, "$.source_endpoint_address_ip4"),
        tmp_src_ep_ip6 = json_extract_scalar(rawJSON, "$.source_endpoint_address_ip6"),
        tmp_src_ep_ip = json_extract_scalar(rawJSON, "$.source_endpoint_ip_address"),
        tmp_tgt_ep_hostname = json_extract_scalar(rawJSON, "$.target_endpoint_host_name"),
        tmp_dest_hosts = json_extract_array(rawJSON, "$.destination_hosts"),
        tmp_tgt_ep_sensor = json_extract_scalar(rawJSON, "$.target_endpoint_sensor_id"),
        tmp_country = json_extract_scalar(rawJSON, "$.location_country_code"),
        tmp_asn_org = json_extract_scalar(rawJSON, "$.source_ip_asn_organization"),
        tmp_sso_app_id = json_extract_scalar(rawJSON, "$.sso_application_identifier"),
        tmp_sso_app_uri = json_extract_scalar(rawJSON, "$.sso_application_uri"),
        tmp_severity = json_extract_scalar(rawJSON, "$.severity"),
        tmp_severity_name = json_extract_scalar(rawJSON, "$.severity_name"),
        tmp_name = json_extract_scalar(rawJSON, "$.name"),
        tmp_objective = json_extract_scalar(rawJSON, "$.objective"),
        tmp_description = json_extract_scalar(rawJSON, "$.description"),
        tmp_tactic_id = json_extract_scalar(rawJSON, "$.tactic_id"),
        tmp_technique_id = json_extract_scalar(rawJSON, "$.technique_id"),
        tmp_incident_type = json_extract_scalar(rawJSON, "$.incident_type"),
        tmp_type = json_extract_scalar(rawJSON, "$.type"),
        tmp_id = json_extract_scalar(rawJSON, "$.id"),
        tmp_composite_id = json_extract_scalar(rawJSON, "$.composite_id"),
        tmp_cid = json_extract_scalar(rawJSON, "$.cid")
    | alter
        xdm.source.user.username = coalesce(tmp_src_upn, tmp_src_account_name, tmp_user_principal, tmp_user_name),
        xdm.source.user.upn = coalesce(tmp_src_upn, tmp_user_principal),
        xdm.source.user.domain = tmp_src_domain,
        xdm.source.user.sam_account_name = tmp_src_sam,
        xdm.source.user.identifier = tmp_src_sid,
        xdm.target.user.username = tmp_tgt_account_name,
        xdm.target.user.identifier = tmp_tgt_sid,
        xdm.source.host.hostname = coalesce(tmp_src_ep_hostname, arrayindex(tmp_src_hosts, 0), arrayindex(tmp_host_names, 0)),
        xdm.source.host.device_id = tmp_src_ep_guid,
        xdm.source.host.ipv4_addresses = arraycreate(tmp_src_ep_ip4),
        xdm.target.host.hostname = coalesce(tmp_tgt_ep_hostname, arrayindex(tmp_dest_hosts, 0)),
        xdm.target.agent.identifier = tmp_tgt_ep_sensor,
        xdm.source.ipv4 = coalesce(tmp_src_ep_ip4, tmp_src_ep_ip),
        xdm.source.ipv6 = tmp_src_ep_ip6,
        xdm.source.location.country = tmp_country,
        xdm.source.asn.as_name = tmp_asn_org,
        xdm.target.application.name = tmp_sso_app_id,
        xdm.target.url = tmp_sso_app_uri,
        xdm.alert.severity = concat(to_string(tmp_severity), " - ", tmp_severity_name),
        xdm.alert.name = tmp_name,
        xdm.alert.category = tmp_objective,
        xdm.alert.mitre_tactics = arraycreate(tmp_tactic_id),
        xdm.alert.mitre_techniques = arraycreate(tmp_technique_id),
        xdm.event.type = coalesce(tmp_incident_type, tmp_type),
        xdm.event.original_event_type = tmp_incident_type,
        xdm.event.description = tmp_description,
        xdm.event.id = coalesce(tmp_id, tmp_composite_id),
        xdm.observer.vendor = "CrowdStrike",
        xdm.observer.product = "Falcon Identity Protection",
        xdm.observer.unique_identifier = tmp_cid;
    filter product = "saas-security"
    | alter
        tmp_user_name = json_extract_scalar(rawJSON, "$.user_name"),
        tmp_user_names = json_extract_array(rawJSON, "$.user_names"),
        tmp_country = json_extract_scalar(rawJSON, "$.country"),
        tmp_asn = json_extract_scalar(rawJSON, "$.asn"),
        tmp_asn_name = json_extract_scalar(rawJSON, "$.asn_name"),
        tmp_severity = json_extract_scalar(rawJSON, "$.severity"),
        tmp_severity_name = json_extract_scalar(rawJSON, "$.severity_name"),
        tmp_name = json_extract_scalar(rawJSON, "$.name"),
        tmp_display_name = json_extract_scalar(rawJSON, "$.display_name"),
        tmp_category = json_extract_scalar(rawJSON, "$.category"),
        tmp_objective = json_extract_scalar(rawJSON, "$.objective"),
        tmp_description = json_extract_scalar(rawJSON, "$.description"),
        tmp_event_summary = json_extract_scalar(rawJSON, "$.event_summary"),
        tmp_mitre_tactics = json_extract_array(rawJSON, "$.mitre_attack[*].tactic_id"),
        tmp_mitre_techniques = json_extract_array(rawJSON, "$.mitre_attack[*].technique_id"),
        tmp_incident_type = json_extract_scalar(rawJSON, "$.incident_type"),
        tmp_type = json_extract_scalar(rawJSON, "$.type"),
        tmp_id = json_extract_scalar(rawJSON, "$.id"),
        tmp_composite_id = json_extract_scalar(rawJSON, "$.composite_id"),
        tmp_cid = json_extract_scalar(rawJSON, "$.cid")
    | alter
        xdm.source.user.username = coalesce(tmp_user_name, arrayindex(tmp_user_names, 0)),
        xdm.source.user.upn = tmp_user_name,
        xdm.source.location.country = tmp_country,
        xdm.source.asn.as_number = to_integer(tmp_asn),
        xdm.source.asn.as_name = tmp_asn_name,
        xdm.alert.severity = concat(to_string(tmp_severity), " - ", tmp_severity_name),
        xdm.alert.name = coalesce(tmp_name, tmp_display_name),
        xdm.alert.category = coalesce(tmp_category, tmp_objective),
        xdm.alert.description = coalesce(tmp_description, tmp_event_summary),
        xdm.alert.mitre_tactics = tmp_mitre_tactics,
        xdm.alert.mitre_techniques = tmp_mitre_techniques,
        xdm.event.type = coalesce(tmp_incident_type, tmp_type),
        xdm.event.original_event_type = tmp_type,
        xdm.event.description = coalesce(tmp_description, tmp_event_summary),
        xdm.event.id = coalesce(tmp_id, tmp_composite_id),
        xdm.observer.vendor = "CrowdStrike",
        xdm.observer.product = "Falcon SaaS Security",
        xdm.observer.unique_identifier = tmp_cid;
  contributes: [User, User.UPN, User.SAM, User.SID, User.Domain, Target.User, Target.User.SID, Endpoint.Hostname, Endpoint.DeviceID, Endpoint.OS, Endpoint.IPv4, Target.Hostname, Process.Name, Process.Path, Process.SHA256, Process.MD5, Process.CommandLine, Process.PID, Network.IP, Network.Location, Network.ASN, Application, Alert.Severity, Alert.Category, Alert.Description, Alert.MITRE, Event.Type, Event.Description, Event.ID, Observer.Vendor, Observer.Product]

correlation_rules:
- subtype: passthrough
  fromversion: 6.10.0
  global_rule_id: SOC CrowdStrike Falcon - Endpoint All Alerts
  name: SOC CrowdStrike Falcon - Endpoint All Alerts
  description: Creates a single XSIAM alert for each CrowdStrike Falcon Endpoint Detection event. Consolidates 15 per-tactic rules from v1.0.14 into one rule using MITRE tactic as the User Defined alert category. Backwards compatible with alert field mappings from all 1.0.14 per-tactic rules.
  alert_name: SOC CrowdStrike Falcon - $alert_name
  alert_description: '''$alert_description | User: $actor_effective_username | Display Name: $display_name | Email: $idr_email | UPN: $idr_upn | Domain: $idr_domain_name | SAM: $idr_sam_account_name | SID: $idr_sid | On-Prem SID: $idr_on_prem_sid | NetBIOS: $idr_netbios'''
  alert_type: null
  crontab: "*/10 * * * *"
  search_window: 20 minutes
  simple_schedule: 10 minutes
  timezone: UTC
  mitre_defs: {}
  investigation_query_link: 'dataset = xdr_data

    | filter agent_hostname = $hostname

    | fields *'
  schema_constants:
    rule_id: 0
    action: ALERTS
    alert_category: User Defined
    alert_domain: DOMAIN_SECURITY
    execution_mode: SCHEDULED
    is_enabled: true
    mapping_strategy: CUSTOM
    severity: User Defined
    drilldown_query_timeframe: ALERT
    user_defined_category: tactic
    user_defined_severity: severity_name
  suppression:
    enabled: true
    duration: 1 hours
    fields:
    - composite_id
  pre_alter: "| alter vendor_name = \"CrowdStrike\", product_name = \"Falcon\"\n\n| filter product = \"epp\"\n\n| alter originalrawlog = to_json_string(rawJSON)\n\n| alter severity_int_raw = severity\n\n| alter\n        tactic                 = if(tactic = \"Malware\", \"Execution\", tactic),\n        mitre_tactic           = if(tactic = \"Malware\", \"Execution\", tactic),\n        mitre_tactic_id        = tactic_id,\n        mitre_technique        = technique,\n        mitre_technique_id     = technique_id\n\n| alter mitre_ids_str = if(\n    technique_id != null and technique != null,\n    concat(technique_id, \" - \", technique),\n    coalesce(technique_id, technique)\n  )\n\n| alter\n        hostname                     = device->hostname,\n        domain                       = device->machine_domain,\n        local_ip                     = device->local_ip,\n        external_ip                  = device->external_ip,\n        mac_address                  = device->mac_address,\n        device_id                    = device->device_id,\n        device_os_version            = device->os_version,\n        device_platform_name         = device->platform_name,\n        device_status                = device->status,\n        device_fqdn                  = if(device->machine_domain != null, concat(device->hostname, \".\", device->machine_domain), device->hostname),\n        device_ou                    = device->ou[],\n        parent_process_name          = parent_details->filename,\n        parent_process_cmd           = parent_details->cmdline,\n        parent_process_path          = parent_details->filepath,\n        parent_process_sha256        = parent_details->sha256,\n        parent_local_process_id      = parent_details->local_process_id,\n        grandparent_process_name     = grandparent_details->filename,\n        grandparent_process_cmd      = grandparent_details->cmdline,\n        grandparent_process_path     = grandparent_details->filepath,\n        grandparent_process_sha256   = grandparent_details->sha256,\n        grandparent_local_process_id = grandparent_details->local_process_id\n\n| alter device_ou_arr = arraymap(device_ou, replace(\"@element\", \"\\\"\", \"\"))\n\n| alter cgo_name = if(lowercase(grandparent_process_name) not in (\"wininit.exe\", \"userinit.exe\"),\n                      grandparent_process_name,\n                      coalesce(parent_process_name, filename)),\n        cgo_path = if(lowercase(grandparent_process_name) not in (\"wininit.exe\", \"userinit.exe\"),\n                      grandparent_process_path,\n                      coalesce(parent_process_path, filepath)),\n        cgo_cmd  = if(lowercase(grandparent_process_name) not in (\"wininit.exe\", \"userinit.exe\"),\n                      grandparent_process_cmd,\n                      coalesce(parent_process_cmd, cmdline))\n\n//| alter dns_queries = dns_requests\n//| alter remote_ips  = network_accesses\n\n| alter alert_name = concat(\n    \"[Endpoint] \",\n    coalesce(user_name, hostname, \"Unknown\"),\n    \" - \",\n    coalesce(tactic, \"Detection\"),\n    \": \",\n    coalesce(technique, name)\n  )\n\n| alter alert_description = concat(\n    coalesce(description, name),\n    \" | Host: \",  coalesce(hostname, \"Unknown\"),\n    \" | User: \",  coalesce(user_name, \"Unknown\"),\n    \" | Severity: \", coalesce(severity_name, \"Unknown\")\n  )\n\n| alter\n        vendor                              = vendor_name,\n        product                             = product_name,\n        originalalertid                     = composite_id,\n        originalalertname                   = alert_name,\n        originalalertsource                 = \"CrowdStrike Falcon\",\n        externallink                        = falcon_host_link,\n        alert_description                   = alert_description,\n        severity                            = severity_name,\n        mitretacticid                       = mitre_tactic_id,\n        mitretacticname                     = mitre_tactic,\n        mitretechniqueid                    = mitre_technique_id,\n        mitretechniquename                  = mitre_technique,\n        agent_hostname                      = hostname,\n        agent_id                            = agent_id,\n        agent_device_domain                 = domain,\n        actor_effective_username            = user_name,\n        actor_process_image_name            = filename,\n        actor_process_image_path            = filepath,\n        actor_process_image_sha256          = sha256,\n        actor_process_command_line          = cmdline,\n        actor_process_os_pid                = local_process_id,\n        causality_actor_process_image_name  = cgo_name,\n        causality_actor_process_image_path  = cgo_path,\n        causality_actor_process_image_sha256 = grandparent_process_sha256,\n        action_file_name                    = filename,\n        action_file_path                    = filepath,\n        action_file_sha256                  = sha256,\n        action_local_ip                     = local_ip\n        //action_remote_ip                    = remote_ips\n| fields\n    device_id, local_ip, user_name, user_principal, cmdline, sha256, domain, hostname, agent_id, pattern_disposition_description, pattern_disposition_details, cgo_cmd, cgo_name, cgo_path, template_instance_id, external_ip, falcon_host_link, mac_address, mitre_tactic_id, mitre_tactic, mitre_technique_id, mitre_technique, mitre_ids_str, tactic_id, tactic, technique_id, technique, objective, composite_id, parent_process_cmd, parent_process_name, parent_local_process_id, parent_process_path, parent_process_sha256, grandparent_process_name, grandparent_process_cmd, grandparent_process_path, grandparent_process_sha256, grandparent_local_process_id, device_ou_arr, process_start_time, local_process_id, md5, scenario, severity_name, aggregate_id, indicator_id, alert_name, alert_description, files_written, originalrawlog, *"
  alert_fields:
  - issue_field: mac
    source: mac_address
  - issue_field: domain
    source: agent_device_domain
  - issue_field: userid
    source: user_principal
  - issue_field: vendor
    source: vendor
  - issue_field: agentid
    source: agent_id
  - issue_field: localip
    source: action_local_ip
  - issue_field: product
    source: product
  - issue_field: usersid
    source: idr_sid
  - issue_field: agent_id
    source: agent_id
