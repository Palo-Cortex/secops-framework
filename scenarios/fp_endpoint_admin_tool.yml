# U1 — False positive, legitimate admin tooling that executed
#
# Part of the unhappy-path set. Every adversary-emulation scenario is a true
# positive, so the close and leave branches have no test data at all; these
# three supply it. Rebuild the TSV with:
#
#     python3 tools/build_unhappy_path_scenarios.py
#
# input_tsv/ is gitignored, so the generator is the recipe — not a comment
# describing hand edits to a row. Per-fixture expectations are documented in
# that script beside each spec.
#
# Medium severity so the automation trigger fires; a LOW issue fires nothing.
scenario: False positive, legitimate admin tooling that executed
compress_window: 30m

sources:
  - name: Microsoft Defender
    file: input_tsv/MS-Defender-FP-Admin-Tool.tsv
    env: .env-deathstar-defender
