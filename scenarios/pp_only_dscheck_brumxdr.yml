# ProofPoint-only replay against brumxdr.
#
# Control for the deathstar PP rule error: same fixture, same rule, different
# tenant. If the rule errors here too it is the rule; if it runs clean it is
# something about deathstar's dataset or install.
#
# 5m so events land inside the rule's 20-minute search_window.
scenario: PP DS-tag check (brumxdr)
compress_window: 5m

sources:
  - name: ProofPoint TAP
    file: input_tsv/ProofPoint-MITRE-Turla-Carbon-in-XSIAM.tsv
    env: .env-brumxdr-proofpoint
