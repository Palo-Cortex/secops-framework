# Lint settings for every Python file in the repo: pack scripts and tools/.
# Run from the repo root: ruff check .
#
# The limits below are where new code should land. Code on main does not meet
# them yet, so this file is not a gate on the whole repo. See
# docs/contributing/engineering-practices.md.

target-version = "py310"
line-length = 120

extend-exclude = [
    "site",
    "out",
    "output",
    "input_tsv",
]

# Pack scripts run on the XSIAM engine, which loads CommonServerPython into
# every script. These names come from that load, not from an import ruff can see.
builtins = [
    "demisto",
    "CommandResults",
    "DemistoException",
    "EntryType",
    "argToBoolean",
    "argToList",
    "entryTypes",
    "execute_command",
    "fileResult",
    "formats",
    "get_error",
    "handle_proxy",
    "isError",
    "is_error",
    "register_module_line",
    "return_error",
    "return_results",
    "return_warning",
    "__line__",
    "tableToMarkdown",
]

[lint]
select = [
    "E",    # pycodestyle errors (PEP 8)
    "W",    # pycodestyle warnings (PEP 8)
    "F",    # pyflakes: unused names, undefined names
    "B",    # bugbear: likely bugs
    "C90",  # cyclomatic complexity
    "PLR",  # pylint refactor: function size limits, unexplained magic numbers
    "SIM",  # simpler forms of the same code
    "N",    # PEP 8 naming
    "D1",   # a public module, class or function says what it does (PEP 257)
    "ANN001",  # every argument has a type hint (PEP 484)
    "ANN201",  # every public function says what it returns (PEP 484)
    "S",    # security (Bandit's rules): TLS checks off, secrets in code, swallowed exceptions, unsafe loads
]
ignore = [
    "F403",     # from CommonServerPython import *: how the engine loads it
    "F405",     # names from that star import; the real ones are declared in builtins
    "S603",     # subprocess without a shell: informational; the tools call git, ruff and pytest on purpose
    "S607",     # a program found on PATH: the same calls
]

[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-args = 6
max-branches = 12
max-returns = 6
max-statements = 50

[lint.per-file-ignores]
# Pack tests follow the XSOAR/XSIAM convention: every test has a docstring in
# Given / When / Then form. Type hints stay optional in tests, where pytest
# fixtures are typed by use.
# Tests assert by design (S101).
"Packs/**/*_test.py" = ["ANN001", "ANN201", "S101"]
"Packs/**/*_test_*.py" = ["ANN001", "ANN201", "S101"]
"Packs/**/test_*.py" = ["ANN001", "ANN201", "S101"]
# Tests of the repo's own tools: the test's name says what it checks.
"tools/**/test_*.py" = ["D1", "ANN001", "ANN201", "S101"]
"conftest.py" = ["D1", "ANN001", "ANN201", "S101"]
