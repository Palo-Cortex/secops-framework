name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "mkdocs.yml.template"
      - "schemas/**"
      - "pack_catalog.json"
      - "Packs/**/xsoar_config.json"
      - "Packs/**/README.md"
      - "Packs/**/POST_CONFIG_README.md"
      - "Packs/**/Lists/**"
      - "tools/generate_capability_catalog.py"
      - "tools/generate_tools_reference.py"
      - "tools/*.py"
      - "tools/*.sh"
      - "tools/generate_schema_docs.py"
      - "tools/generate_pack_overviews.py"
      - "tools/generate_home_page.py"
      - "tools/generate_mkdocs_nav.py"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, cancel any in-progress run
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install mkdocs-material pymdown-extensions pyyaml mkdocs-exclude

      # Run generators in dependency order (the same order as tools/prep_docs.py):
      #   1. capability catalog — splices docs/capabilities.yml into
      #                           docs/reference/index.md and pack READMEs
      #   2. tools reference    — writes docs/contributing/tools.md from docstrings
      #   3. schema docs        — writes docs/<pack>/<schema>.md
      #   4. pack overviews     — writes docs/<pack>/overview.md
      #   5. home page          — writes docs/index.md
      #   6. mkdocs nav         — reads catalog + docs/nav.yml, writes mkdocs.yml
      #
      # Each generator prunes its own orphan files (matched by GENERATED banner).
      # Output lives only in the runner's filesystem — `mkdocs build` consumes
      # it directly. We never commit it back, so version bumps don't loop.
      - name: Regenerate capability catalog
        run: python tools/generate_capability_catalog.py

      - name: Regenerate tools reference
        run: python tools/generate_tools_reference.py

      - name: Regenerate schema docs
        run: python tools/generate_schema_docs.py

      - name: Regenerate pack overviews
        run: python tools/generate_pack_overviews.py

      - name: Regenerate home page
        run: python tools/generate_home_page.py

      - name: Regenerate mkdocs nav
        run: python tools/generate_mkdocs_nav.py

      - name: Build site
        # Strict: a broken link or a page missing from docs/nav.yml fails the build.
        run: mkdocs build --strict

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
