  socfwemailthreaturl: cleaned_url
  socfwemailthreattype: threat_type
  socfwemailthreatstatus: remediationStatus
  socfwemailthreatid: threatId
  socfwemailclassification: threat_classification
  abnormalsecurityattacktype: attackType
  abnormalsecurityattackvector: attackVector
  abnormalsecurityattackstrategy: attackStrategy
  abnormalsecurityattackedparty: attackedParty
  abnormalsecurityimpersonatedparty: impersonatedParty
  abnormalsecuritysenderdomain: senderDomain
  abnormalsecuritysenderip: senderIpAddress
  abnormalsecurityfromname: fromName
  abnormalsecuritymessageid: abxMessageIdStr
  abnormalsecurityremediationstatus: remediationStatus
  abnormalsecurityremediationtimestamp: remediationTimestamp
  abnormalsecurityurlcount: urlCount
  abnormalsecurityattachmentcount: attachmentCount
  hostname: agent_hostname
  domain: agent_device_domain
