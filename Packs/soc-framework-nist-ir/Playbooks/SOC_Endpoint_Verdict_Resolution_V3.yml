    type: condition
    task:
      id: a72f6c17-0e14-468e-969b-a8ac71d9def9
      version: -1
      name: Sandbox Detonation Enabled?
      description: 'Gate: only run soc-detonate-file if SOCFWFeatureFlags.sandbox_detonation
        = true. When false, flow proceeds to DBot verdict using hash prevalence from
        soc-enrich-file (already executed in SOC Email/Endpoint IOC Enrichment). Flip
        flag after configuring WildFire, VirusTotal, or another sandbox integration.'
      type: condition
      iscommand: false
      brand: ""
      playbooktaskmissingcomponent: null
      istaskmissingcomponenterrordismissed: false
    nexttasks:
      '#default#':
      - "25"
      "yes":
      - "18"
    separatecontext: false
    conditions:
    - label: "yes"
      condition:
      - - operator: isEqualString
          left:
            value:
              complex:
                root: lists
                accessor: SOCFWFeatureFlags
                transformers:
                - operator: getField
                  args:
                    field:
                      value:
                        simple: sandbox_detonation
                - operator: getField
                  args:
                    field:
                      value:
                        simple: enabled
            iscontext: true
          right:
            value:
              simple: "true"
          ignorecase: true
    continueonerrortype: ""
    view: |-
