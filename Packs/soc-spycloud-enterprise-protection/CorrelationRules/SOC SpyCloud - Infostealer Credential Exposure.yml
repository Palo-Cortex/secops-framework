  spycloud_password_type: spycloud_password_type
  spycloud_country: spycloud_country
  tags: alert_tags
  alert_name: alert_name
alert_name: $alert_name
alert_type: null
crontab: '*/10 * * * *'
dataset: alerts
name: SOC SpyCloud - Infostealer Credential Exposure
description: >-
  Creates an XSIAM alert for each SpyCloud Enterprise Protection infostealer
  record (spycloudenterpriseprotectionfeed_generic_alert_raw, breach_category =
  infostealer): a corporate credential harvested from an infected device.
  Canonicalizes the exposed email as the identity pivot, maps the infected host,
  its IP and the stealer path to the endpoint/network pivots, and injects
  DS:SpyCloud/Enterprise Protection so Foundation routes the alert. Credential
  material and personal data in the feed are never read.
drilldown_query_timeframe: ALERT
execution_mode: SCHEDULED
global_rule_id: SOC SpyCloud - Infostealer Credential Exposure
investigation_query_link: |-
  dataset = spycloudenterpriseprotectionfeed_generic_alert_raw
  | filter lowercase(email) = $exposed_email
  | fields _time, breach_category, breach_title, severity, target_domain, user_hostname
is_enabled: true
lookup_mapping: []
mapping_strategy: CUSTOM
mitre_defs: {}
search_window: 20 minutes
severity: User Defined
simple_schedule: 10 minutes
suppression_duration: 24 hours
suppression_enabled: true
suppression_fields:
- originalalertid
timezone: null
user_defined_category: sc_category
user_defined_severity: severity
xql_query: |
  dataset = spycloudenterpriseprotectionfeed_generic_alert_raw
  | alter vendor_name = "SpyCloud", product_name = "Enterprise Protection"

  | filter breach_category = "infostealer"

  | alter sc_category = "Credential Exposure"

  | alter sc_sev = to_float(severity)
  | alter severity = if(
          sc_sev >= 25, "Critical",
          sc_sev >= 20, "High",
          sc_sev >= 5,  "Medium",
          "Low"
      )

  | alter
          sc_ip_first      = arrayindex(ip_addresses -> [], 0),
          sc_infected_time = infected_time,
          sc_av            = arraystring(av_softwares -> [], ", ")

  | alter sc_ipv4 = arrayindex(regextract(sc_ip_first, "([0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3})"), 0)

  | alter exposed_email = lowercase(coalesce(email, if(username contains "@", username, null)))
  | alter user_principal = exposed_email
  | alter user_name      = coalesce(exposed_email, username)
  | alter display_name   = user_sys_registered_owner
  | alter actor_effective_username = coalesce(exposed_email, lowercase(username))

  | alter alert_name = concat(
          "[Cloud] ",
          coalesce(exposed_email, username, "Unknown"),
          " - Credential Exposure: ",
          coalesce(breach_title, "Infostealer")
      )

  | alter alert_description = concat(
          "SpyCloud infostealer record: a credential for ",
          coalesce(exposed_email, username, "an unknown account"),
          " was harvested from an infected device.",
          " | Target: ",    coalesce(target_domain, "Unknown"),
          " | Host: ",      coalesce(user_hostname, infected_machine_id, "Unknown"),
          " | OS: ",        coalesce(user_os, "-"),
          " | Stealer path: ", coalesce(infected_path, "-"),
          " | Infected: ",  coalesce(to_string(sc_infected_time), "-"),
          " | AV: ",        coalesce(sc_av, "-"),
          " | Password type: ", coalesce(password_type, "-"),
          " | Severity: ",  coalesce(severity, "Unknown")
      )

  | alter
          vendor                               = vendor_name,
          product                              = product_name,
          originalalertid                      = document_id,
          originalalertname                    = coalesce(breach_title, "Infostealer credential exposure"),
          originalalertsource                  = "SpyCloud - Enterprise Protection",
          externallink                         = null,
          severity                             = severity,
          mitretacticid                        = "TA0006",
          mitretacticname                      = "Credential Access",
          mitretechniqueid                     = "T1555",
          mitretechniquename                   = "Credentials from Password Stores",
          agent_hostname                       = user_hostname,
          agent_id                             = infected_machine_id,
          agent_device_domain                  = user_sys_domain,
          actor_process_image_name             = null,
          actor_process_image_path             = infected_path,
          actor_process_image_sha256           = null,
          actor_process_command_line           = null,
          actor_process_os_pid                 = null,
          causality_actor_process_image_name   = null,
          causality_actor_process_image_path   = null,
          causality_actor_process_image_sha256 = null,
          action_file_name                     = null,
          action_file_path                     = null,
          action_file_sha256                   = null,
          action_local_ip                      = sc_ipv4,
          action_remote_ip                     = null,
          dns_query_name                       = target_domain

  | alter
          spycloud_breach_category   = breach_category,
          spycloud_breach_title      = breach_title,
          spycloud_severity          = severity,
          spycloud_document_id       = document_id,
          spycloud_source_id         = to_string(source_id),
          spycloud_publish_date      = spycloud_publish_date,
          spycloud_target_domain     = target_domain,
          spycloud_target_url        = target_url,
          spycloud_infected_host     = user_hostname,
          spycloud_infected_machine  = infected_machine_id,
          spycloud_infected_path     = infected_path,
          spycloud_infected_time     = sc_infected_time,
          spycloud_user_os           = user_os,
          spycloud_av_software       = sc_av,
          spycloud_password_type     = password_type,
          spycloud_country           = country_code

  | alter alert_tags = arraycreate("DS:SpyCloud/Enterprise Protection", "DOM:Security")

  | alter idr_sid = null,
          idr_upn = user_principal,
          idr_email = if(user_principal contains "@", lowercase(user_principal), if(user_name contains "@", lowercase(user_name), null)),
          idr_netbios = null,
          idr_display_name = null,
          idr_domain_name = null,
          idr_sam_account_name = null,
          idr_on_prem_sid = null

  // ============== CIE ENRICHMENT (optional, OFF by default) ==============
  // Cloud Identity Engine enrichment is disabled. To enable it:
  //   1. Set this rule to a schedule (it ships REAL_TIME):
  //        execution mode = SCHEDULED
  //        crontab        = */10 * * * *
  //        search window  = 20 minutes
  //        schedule label = 10 minutes
  //   2. Delete the /* and */ lines that wrap the block below.
  // The join coalesces socfw_identity_map values OVER the inline idr_* fields;
  // the alert-field mappings do not change. Requires SOC IdentityResolve.
  // ----------------------------------------------------------------------
  /*
  | filter timestamp_diff(time_frame_end(), _insert_time, "MINUTE") <= 15
  | alter cie_join_key = lowercase(coalesce(if(user_principal contains "@", user_principal, null), if(user_name contains "@", user_name, null)))
  | join type = left (
      dataset = socfw_identity_map
      | filter type = "user"
      | alter cie_join_key = lowercase(coalesce(upn, email))
      | dedup cie_join_key by asc netbios_and_sam_account_name
      | fields cie_join_key,
               sid                          as map_sid,
               upn                          as map_upn,
               email                        as map_email,
               display_name                 as map_display,
               domain_name                  as map_domain,
               sam_account_name             as map_sam,
               on_prem_sid                  as map_on_prem_sid,
               netbios_and_sam_account_name as map_netbios,
               title                        as map_title,
               department                   as map_department,
               manager_raw                  as map_manager,
               country                      as map_country,
               company_name                 as map_company,
               location                     as map_location,
               account_status               as map_account_status
    ) as m cie_join_key = m.cie_join_key
  | alter idr_sid              = coalesce(map_sid, idr_sid),
          idr_upn              = coalesce(map_upn, idr_upn),
          idr_email            = coalesce(map_email, idr_email),
          idr_display_name     = coalesce(map_display, idr_display_name),
          idr_domain_name      = coalesce(map_domain, idr_domain_name),
          idr_sam_account_name = coalesce(map_sam, idr_sam_account_name),
          idr_on_prem_sid      = coalesce(map_on_prem_sid, idr_on_prem_sid),
          idr_netbios          = coalesce(map_netbios, idr_netbios),
          idr_title            = map_title,
          idr_department       = map_department,
          idr_manager          = map_manager,
          idr_country          = map_country,
          idr_company          = map_company,
          idr_location         = map_location,
          idr_account_status   = map_account_status
  | alter _time = _insert_time
  */
  // ===================== END CIE ENRICHMENT =============================
  | alter original_display_name   = display_name,
          original_user_principal = user_principal

  | alter display_name   = coalesce(idr_display_name, idr_sam_account_name, display_name),
          email          = idr_email,
          user_principal = coalesce(idr_upn, user_principal)
  | alter actor_effective_username = lowercase(coalesce(idr_email, idr_upn, idr_netbios, actor_effective_username))

  | alter idr_email = coalesce(idr_email, idr_upn, if(user_principal contains "@", lowercase(user_principal), null), if(user_name contains "@", lowercase(user_name), null))
  | alter email     = idr_email

  | alter original_user_name = user_name
  | alter user_name = if(user_name contains "$", user_name, coalesce(idr_email, idr_upn, user_name))
  | fields
      _time, document_id, breach_category, breach_title, sc_category, sc_sev, severity, exposed_email, user_principal, user_name, display_name, username, email_domain, target_domain, target_url, user_hostname, infected_machine_id, infected_path, sc_infected_time, sc_ipv4, sc_av, user_os, user_sys_domain, password_type, country_code, alert_name, alert_description, vendor, product, originalalertid, originalalertname, originalalertsource, externallink, mitretacticid, mitretacticname, mitretechniqueid, mitretechniquename, agent_hostname, agent_id, agent_device_domain, actor_process_image_path, action_local_ip, dns_query_name, spycloud_breach_category, spycloud_breach_title, spycloud_severity, spycloud_document_id, spycloud_source_id, spycloud_publish_date, spycloud_target_domain, spycloud_target_url, spycloud_infected_host, spycloud_infected_machine, spycloud_infected_path, spycloud_infected_time, spycloud_user_os, spycloud_av_software, spycloud_password_type, spycloud_country, alert_tags, *
