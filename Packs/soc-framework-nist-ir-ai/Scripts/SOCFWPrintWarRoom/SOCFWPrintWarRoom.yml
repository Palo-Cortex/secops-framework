comment: >-
  Layout button handler. Exports the issue War Room verbatim to a self-contained
  printable HTML file attached to the issue - open it in a browser and print to
  PDF for legal or audit. Scope is the issue the button was pressed on, not the
  case it belongs to. Read-only - reads investigation entries via the Core REST
  API and writes a file. Executes nothing, so no Shadow Mode gate applies.
  Entries are reproduced as written, in order, HTML-escaped, with no
  summarising or interpretation.
