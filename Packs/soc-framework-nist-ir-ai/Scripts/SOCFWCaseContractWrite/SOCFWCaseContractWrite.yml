name: SOCFWCaseContractWrite
script: ''
type: python
tags:
- SOC
- SOC_Framework_Unified
- NIST 800-61
comment: |-
  Writes a whole case contract to the parent case in one execution.

  Run from a member issue of the case: setParentIncidentContext is the only route
  that writes case context, and it stores every value as a string, so the
  contract goes up leaf by leaf. This script makes those writes in-process, so
  the JOB spends one call per case instead of one per leaf.
args:
- name: contract
  required: true
  description: The contract as a JSON object of leaf name to value. Arrays and
    objects are stored as JSON strings.
- name: root
  description: Context root the leaves are written under.
  defaultValue: SOCFramework.Analysis.AI
outputs:
- contextPath: SOCFramework.CaseContractWrite.written
  description: Leaves written.
  type: Number
- contextPath: SOCFramework.CaseContractWrite.failed
  description: Leaves that failed to write.
  type: Number
scripttarget: 0
timeout: 5m0s
subtype: python3
pswd: ""
runonce: false
