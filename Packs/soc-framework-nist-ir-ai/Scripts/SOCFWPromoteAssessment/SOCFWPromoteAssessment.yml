commonfields:
  id: SOCFWPromoteAssessment
  version: -1
name: SOCFWPromoteAssessment
script: ''
type: python
subtype: python3
dockerimage: demisto/python3:3.12.8.1983910
comment: Parses the assessment JSON, promotes the flat fields into the Assessment
  namespace, and writes an ai_reasoning row to the execution dataset.
tags:
- socfw
enabled: true
args:
- name: source_key
  description: Context path holding the assessment.
  defaultValue: Assessment.AI
- name: target_namespace
  description: Namespace to promote the flat fields into.
  defaultValue: Assessment
- name: phase
  description: Phase recorded on the ai_reasoning row.
  defaultValue: Assessment
- name: promote
  description: Whether to write the parsed object and flat fields back to context.
  defaultValue: 'true'
scripttarget: 0
runonce: false
runas: DBotWeakRole
fromversion: 6.10.0
marketplaces:
- marketplacev2
supportedModules:
- X1
- X3
- X5
system: true
