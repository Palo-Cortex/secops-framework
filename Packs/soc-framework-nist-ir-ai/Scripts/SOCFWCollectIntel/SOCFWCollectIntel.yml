commonfields:
  id: SOCFWCollectIntel
  version: -1
name: SOCFWCollectIntel
script: ''
type: python
subtype: python3
dockerimage: demisto/python3:3.11.10.116949
comment: Gathers reputation and threat-intel context roots into a single key so the
  issue assessment prompt can read them. Roots come from CaseIntelRoots.
tags:
- socfw
enabled: true
args:
- name: roots
  description: Comma-separated context roots to collect. Defaults to CaseIntelRoots.
- name: output_key
  description: Context path to write the collected intel to.
  defaultValue: Assessment.Intel
- name: max_chars
  description: Serialised size budget. Whole roots are dropped largest-first to fit.
  defaultValue: '20000'
scripttarget: 0
runonce: false
runas: DBotWeakRole
fromversion: 6.10.0
marketplaces:
- marketplacev2
supportedModules:
- X1
- X3
- X5
system: true
