    taskid: d73c9fcd-7c4f-47b0-b210-10753e2826eb
    type: regular
    task:
      id: d73c9fcd-7c4f-47b0-b210-10753e2826eb
      version: -1
      name: Aggregate — analysis watermark
      description: Per-case analysis history from the execution dataset. This is the watermark. A pack-installed List is system-owned and a JOB cannot write to it, so the dataset is what records which cases have been analysed and at what issue and contract counts.
      script: '|||xdr-xql-generic-query'
      type: regular
      iscommand: true
      brand: ''
      playbooktaskmissingcomponent:
      istaskmissingcomponenterrordismissed: false
    nexttasks:
      '#none#':
      - '110'
    scriptarguments:
      query:
        simple: "dataset = xsiam_socfw_ir_execution_raw\n| filter event_type = \"case_containment\" and case_id != null\n| alter produced = if(reasoning_status = \"no_output\", 0, 1)\n| comp sum(produced) as analyses,\n       count() as attempts,\n       max(issue_count) as analysed_issue_count,\n       max(contract_covered_issues) as analysed_covered_issues,\n       max(contract_total_issues) as analysed_total_issues,\n       max(_time) as analysed_at\n       by case_id"
      query_name:
        simple: socfw_case_watermark
      time_frame:
        simple: 30 days
    separatecontext: false
    continueonerror: true
    continueonerrortype: ''
    view: "{\n  \"position\": {\n    \"x\": 50,\n    \"y\": 405\n  }\n}"
    note: false
    timertriggers: []
