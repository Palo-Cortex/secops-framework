        simple: "dataset = issues\n| alter incident_id = arrayindex(xdm.issue.case_ids, 0)\n| filter incident_id in (${SOCFramework.Case.CandidateFilter}) and xdm.issue.domain = \"SECURITY\"\n| alter covered = if(playbook_run_status = \"completed\", 1, 0)\n| comp count() as n, sum(covered) as covered_issues,\n       min(xdm.issue.domain) as issue_domain\n       by incident_id\n| sort asc incident_id"
      query_name:
        simple: socfw_case_coverage
      time_frame:
        simple: ${SOCFramework.Containment.Config.CaseWindowHours} hours
