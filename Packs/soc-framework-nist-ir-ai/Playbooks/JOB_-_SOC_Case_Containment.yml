    type: regular
    task:
      id: 21d4897b-b8a1-44d9-8471-c53752a4bc93
      version: -1
      name: Aggregate — entities
      description: Distinct host, hash and address combinations per case, in one query rather than three. Array fields are joined to delimited strings instead of expanded, because arrayexpand drops the whole row when the field is null, which silently removed an entire case that carried addresses but no file hashes, and expanding two array fields multiplies rows. The correlated row also keeps which host carried which binary and which address, which three separate aggregates threw away.
      script: '|||xdr-xql-generic-query'
      type: regular
      iscommand: true
      brand: ''
      playbooktaskmissingcomponent:
      istaskmissingcomponenterrordismissed: false
    nexttasks:
      '#none#':
      - '155'
    scriptarguments:
      query:
        simple: "dataset = alerts\n| filter incident_id in (${SOCFramework.Case.CandidateFilter})\n| alter sha = arraystring(file_sha256, \"|\")\n| alter lip = arraystring(local_ip, \"|\")\n| comp count() as n by incident_id, host_name, endpoint_id, sha, lip\n| sort asc incident_id, desc n"
      query_name:
        simple: socfw_case_entities
      time_frame:
        simple: ${SOCFramework.Containment.Config.CaseWindowHours} hours
    separatecontext: false
    continueonerror: true
    continueonerrortype: ''
