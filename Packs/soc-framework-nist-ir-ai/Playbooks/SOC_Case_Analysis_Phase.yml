name: SOC Case Analysis Phase
description: |-
  Runs Detection & Analysis for a single case. Called once per case by JOB - SOC Case Analysis with forEach over the case payloads.

  Every task argument here is a scalar read from CaseIter.*, never an object or an array. XSIAM runs a task once per element when an argument resolves to an array, and the sub-playbook input accumulates across iterations - which fired each task once per case seen so far and rendered later cases under earlier headers. Task 5 pins the current case to scalar keys and nothing downstream touches the input again.

  This is the AI seam. The pack version carries a title placeholder and no aiTask so it installs where AI is unavailable; the same playbook id is uploaded by hand with the aiTask bound where AI exists.
tags:
- SOC
- SOC_Framework_Unified
- NIST 800-61
