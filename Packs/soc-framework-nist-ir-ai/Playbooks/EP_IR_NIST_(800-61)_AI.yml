name: EP_IR_NIST (800-61) AI
description: |-
  Entry Point playbook for case-scoped NIST IR. Assign it to the automation trigger in place of EP_IR_NIST (800-61)_V3 when the case lifecycle is ready; swap back to switch off.

  Issue-level automation ends here. This playbook initializes the lifecycle context, calls Foundation - Upon Trigger to normalize, classify, dedup and build the SOC Framework contract, and exits.

  The NIST alert response phases (Preparation, Detection & Analysis, Containment, Eradication, Recovery) do not run per issue. They run at case scope in JOB - SOC Case Analysis, which reads the contracts every issue in a case has written.

  Both entry points can be installed at once because only the one bound to the automation trigger executes, which makes the cutover and the rollback a trigger change rather than a content change.
