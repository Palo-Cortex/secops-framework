name: JOB - SOCFW Analyst Assignment
description: Refreshes the on-duty roster from the customer's schedule sources, then
  gives unassigned open cases an owner from it, least loaded first. Assignment ships
  shadowed. A failed roster sync leaves the last roster in place and assignment still
  runs on it.
