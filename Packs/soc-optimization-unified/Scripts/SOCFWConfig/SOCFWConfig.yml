commonfields:
  id: SOCFWConfig
  version: -1
name: SOCFWConfig
script: ''
type: python
subtype: python3
dockerimage: demisto/python3:3.12.8.1983910
comment: Configures the SOC Framework on this tenant. status shows which actions
  are live or simulated for each actor, the exact list field that decided each one,
  and which customer values are set. shadow takes one action on or off shadow for
  named actors, or returns it to the shipped setting. set sets or removes one customer
  value, such as a block-list id or proxy category. shadow and set are dry runs unless
  apply=yes. Settings are written to SOCFWTenantConfig, a JSON list this script creates
  on first write (through the Core REST API integration) and no pack install overwrites.
tags:
- socfw
enabled: true
scripttarget: 0
runonce: false
runas: DBotWeakRole
fromversion: 6.10.0
marketplaces:
- marketplacev2
supportedModules:
- X1
- X3
- X5
system: false
args:
- name: command
  description: status (default), shadow or set.
  defaultValue: status
  auto: PREDEFINED
  predefined:
  - status
  - shadow
  - set
- name: action
  description: The action, e.g. soc-star-case. Required for shadow; for status, limits
    the table to these actions (comma-separated).
- name: actor
  description: For shadow - who asks for the action - analyst, ai, automation or issue_emergency.
    Comma-separated for more than one.
- name: vendor
  description: For set - the vendor the value belongs to, e.g. Zscaler or ThreatStopv2.
- name: arg
  description: For set - the setting, e.g. category-id, list_id or using. status lists them.
- name: value
  description: For shadow - on (simulate), off (run for real) or default (use the shipped
    setting). For set - the value, or default to remove it.
- name: apply
  description: yes writes the change. Anything else is a dry run that shows the change.
  defaultValue: "no"
  auto: PREDEFINED
  predefined:
  - "yes"
  - "no"
outputs:
- contextPath: SOCFWConfig.Status.rows
  description: One row per action and actor - action, actor, shadow, state, decided_by
    (tenant_config, action_actor or action_default), field, read_only.
  type: Unknown
- contextPath: SOCFWConfig.Status.contract_version
  description: Version of this output's keys.
  type: Number
- contextPath: SOCFWConfig.Shadow.changes
  description: One row per actor - actor, from, to, decided_by_before, decided_by_after,
    changed.
  type: Unknown
- contextPath: SOCFWConfig.Shadow.dry_run
  description: True when nothing was written.
  type: Boolean
- contextPath: SOCFWConfig.Shadow.applied
  description: True when the change was written and read back.
  type: Boolean
- contextPath: SOCFWConfig.Shadow.refused
  description: Actions not changed, with the reason.
  type: Unknown
- contextPath: SOCFWConfig.Shadow.apply_command
  description: The command that writes this change.
  type: String
- contextPath: SOCFWConfig.Shadow.contract_version
  description: Version of this output's keys.
  type: Number
- contextPath: SOCFWConfig.Shadow.recorded
  description: True when every changed actor got a config_change row in xsiam_socfw_ir_execution_raw.
  type: Boolean
- contextPath: SOCFWConfig.Status.values
  description: One row per customer value - vendor, arg, value, set, required, used_by.
  type: Unknown
- contextPath: SOCFWConfig.Set.from
  description: The value before the change.
  type: String
- contextPath: SOCFWConfig.Set.to
  description: The value after the change.
  type: String
- contextPath: SOCFWConfig.Set.applied
  description: True when the change was written and read back.
  type: Boolean
- contextPath: SOCFWConfig.Set.dry_run
  description: True when nothing was written.
  type: Boolean
- contextPath: SOCFWConfig.Set.apply_command
  description: The command that writes this change.
  type: String
- contextPath: SOCFWConfig.Set.contract_version
  description: Version of this output's keys.
  type: Number
