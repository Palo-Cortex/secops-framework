commonfields:
  id: SOCFWConfig
  version: -1
name: SOCFWConfig
script: ''
type: python
subtype: python3
dockerimage: demisto/python3:3.12.8.1983910
comment: Configures the SOC Framework on this tenant. status shows which actions
  are live or simulated for each actor and whether the tenant config or the shipped
  default decided it. shadow takes one action on or off shadow for named actors, or
  returns it to the shipped default; it is a dry run unless apply=yes. Settings are
  written to SOCFWTenantConfig, which this script creates on first write and no pack
  install overwrites.
tags:
- socfw
enabled: true
scripttarget: 0
runonce: false
runas: DBotWeakRole
fromversion: 6.10.0
marketplaces:
- marketplacev2
supportedModules:
- X1
- X3
- X5
system: false
args:
- name: command
  description: status (default) or shadow.
  defaultValue: status
  auto: PREDEFINED
  predefined:
  - status
  - shadow
- name: action
  description: The action, e.g. soc-star-case. Required for shadow; for status, limits
    the table to these actions (comma-separated).
- name: actor
  description: Who asks for the action - analyst, ai, framework, automation or issue_emergency.
    Comma-separated for more than one. Required for shadow.
- name: value
  description: on (simulate), off (run for real) or default (remove the setting and use
    the shipped default). Required for shadow.
  auto: PREDEFINED
  predefined:
  - "on"
  - "off"
  - default
- name: apply
  description: yes writes the change. Anything else is a dry run that shows the change.
  defaultValue: "no"
  auto: PREDEFINED
  predefined:
  - "yes"
  - "no"
outputs:
- contextPath: SOCFWConfig.Status.rows
  description: One row per action and actor - action, actor, shadow, state, decided_by,
    read_only.
  type: Unknown
- contextPath: SOCFWConfig.Status.contract_version
  description: Version of this output's keys.
  type: Number
- contextPath: SOCFWConfig.Shadow.changes
  description: One row per actor - actor, from, to, decided_by_before, decided_by_after,
    changed.
  type: Unknown
- contextPath: SOCFWConfig.Shadow.dry_run
  description: True when nothing was written.
  type: Boolean
- contextPath: SOCFWConfig.Shadow.applied
  description: True when the change was written and read back.
  type: Boolean
- contextPath: SOCFWConfig.Shadow.refused
  description: Actions not changed, with the reason.
  type: Unknown
- contextPath: SOCFWConfig.Shadow.apply_command
  description: The command that writes this change.
  type: String
- contextPath: SOCFWConfig.Shadow.contract_version
  description: Version of this output's keys.
  type: Number
- contextPath: SOCFWConfig.Shadow.recorded
  description: True when every changed actor got a config_change row in xsiam_socfw_ir_execution_raw.
  type: Boolean
