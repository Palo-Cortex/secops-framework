commonfields:
  id: SOCFWConfig
  version: -1
name: SOCFWConfig
script: ''
type: python
subtype: python3
dockerimage: demisto/python3:3.12.8.1983910
comment: Configures the SOC Framework on this tenant. status shows which actions
  are live or simulated for each actor, the exact list field that decided each one,
  and which customer values are set. shadow takes one action on or off shadow for
  named actors, or returns it to the shipped setting. set sets or removes one customer
  value, such as a block-list id or proxy category. emergency lists, edits or adds
  the issue-level emergency response policies. triage shows or sets Auto Triage's
  score threshold and age window. Every change is a dry run unless
  apply=yes. Settings are written to SOCFWTenantConfig, a JSON list this script creates
  on first write (through the Core REST API integration) and no pack install overwrites.
tags:
- socfw
enabled: true
scripttarget: 0
runonce: false
runas: DBotWeakRole
fromversion: 6.10.0
marketplaces:
- marketplacev2
supportedModules:
- X1
- X3
- X5
system: false
args:
- name: command
  description: status (default), shadow, set, job, owner, emergency or triage. Each command
    takes only the arguments marked with it; one marked for another command is refused.
  defaultValue: status
  auto: PREDEFINED
  predefined:
  - status
  - shadow
  - set
  - job
  - owner
  - emergency
  - triage
- name: action
  description: "[status, shadow, emergency] The action, e.g. soc-star-case. Required for
    shadow. For status, limits the table to these actions (comma-separated). For emergency,
    the actions the policy runs, in order (comma-separated)."
- name: actor
  description: "[shadow] Who asks for the action. Pick one or more."
  auto: PREDEFINED
  isArray: true
  predefined:
  - analyst
  - ai
  - automation
  - issue_emergency
- name: vendor
  description: "[set] The vendor the value belongs to, e.g. Zscaler or ThreatStopv2."
- name: arg
  description: "[set] The setting, e.g. category-id, list_id or using. status lists them."
- name: job
  description: "[job, owner] Which framework JOB."
  auto: PREDEFINED
  predefined:
  - Auto Triage V3
  - SOC Case Analysis
- name: owner
  description: "[owner] The user who owns the job (an email or username on this tenant).
    A job cannot run without one."
- name: value
  description: "[shadow, set, job] For shadow - on (simulate), off (run for real) or default
    (use the shipped setting). For set - the value, or default to remove it. For job - on
    (runs on its schedule) or off."
- name: policy
  description: "[emergency] The policy's label - a shipped one (identity_compromise,
    endpoint_execution, email_delivered) to edit it, or a new one to add it. Leave empty
    to list every policy."
- name: about
  description: "[emergency] What the issue is about - identity, endpoint, email ...
    Matches the issue's product category or the assessment's primary entity type
    (comma-separated)."
- name: source
  description: "[emergency] Source keys the policy applies to, e.g. ds_okta_systemlog
    (comma-separated)."
- name: rule_id
  description: "[emergency] Detection rule ids (issue.ruleid) the policy applies to,
    comma-separated. Local to this tenant, so only on a policy of its own."
- name: name_contains
  description: "[emergency] Text the issue name must contain, case-insensitive. For
    issues with no rule id; depends on how the detection is named."
- name: tactic
  description: "[emergency] MITRE tactic ids or names on the issue the policy applies
    to, comma-separated (TA0011, Command and Control)."
- name: verdict
  description: "[emergency] Assessment verdicts that let it act (default malicious), or
    any."
  isArray: true
  auto: PREDEFINED
  predefined:
  - malicious
  - suspicious
  - benign
  - inconclusive
  - any
- name: confidence
  description: "[emergency] Minimum assessment confidence (default high), or any."
  auto: PREDEFINED
  predefined:
  - low
  - medium
  - high
  - any
- name: exposure
  description: "[emergency] Assessment exposure values that let it act (default any)."
  isArray: true
  auto: PREDEFINED
  predefined:
  - none
  - attempted
  - delivered
  - executed
  - unknown
  - any
- name: enabled
  description: "[emergency] on or off for this policy on this tenant; default returns
    it to what shipped, or removes a policy of this tenant's own."
  auto: PREDEFINED
  predefined:
  - "on"
  - "off"
  - default
- name: entity_type
  description: "[emergency] Optional on a policy - the assessment's primary entity type
    must be one of these (identity, endpoint, email, ip ...; comma-separated)."
- name: protect
  description: "[emergency] Never contained, for every policy - host:<name or pattern>,
    ip:<address>, cidr:<range>, account:<name or pattern>, domain:<name or pattern> (never
    blocked) or list:<XSIAM list>, comma-separated. Replaces this tenant's list; default clears it."
- name: containable_hosts
  description: "[emergency] When set, a host action runs only on these - host:, ip:, cidr:
    or list: entries, comma-separated. Replaces the role check. default clears it."
- name: containable_roles
  description: "[emergency] Roles a host may have to be contained (workstation, server,
    domain_controller), or any to turn the role check off. default returns to workstation."
- name: role
  description: "[emergency] A role for hosts that report none - host:<name or pattern>:<role>,
    comma-separated. default clears them."
- name: escalate_severity
  description: "[emergency] The case severity when containment was needed but blocked (low,
    medium, high, critical; raise only). default returns to critical."
  auto: PREDEFINED
  predefined:
  - low
  - medium
  - high
  - critical
  - default
- name: score_threshold
  description: "[triage] Auto Triage closes a case scored at or below this (0 or more). off
    ignores the score, so every unstarred New case older than the window closes. default
    returns to the value in SOCOptimizationConfig_V3."
- name: window_hours
  description: "[triage] Auto Triage never closes a case younger than this many hours (more
    than 0). default returns to the value in SOCOptimizationConfig_V3."
- name: apply
  description: yes writes the change. Anything else is a dry run that shows the change.
  defaultValue: "no"
  auto: PREDEFINED
  predefined:
  - "yes"
  - "no"
outputs:
- contextPath: SOCFWConfig.Status.rows
  description: One row per action and actor - action, actor, shadow, state, decided_by
    (tenant_config, action_actor or action_default), field, read_only.
  type: Unknown
- contextPath: SOCFWConfig.Status.contract_version
  description: Version of this output's keys.
  type: Number
- contextPath: SOCFWConfig.Shadow.changes
  description: One row per actor - actor, from, to, decided_by_before, decided_by_after,
    changed.
  type: Unknown
- contextPath: SOCFWConfig.Shadow.dry_run
  description: True when nothing was written.
  type: Boolean
- contextPath: SOCFWConfig.Shadow.applied
  description: True when the change was written and read back.
  type: Boolean
- contextPath: SOCFWConfig.Shadow.refused
  description: Actions not changed, with the reason.
  type: Unknown
- contextPath: SOCFWConfig.Shadow.apply_command
  description: The command that writes this change.
  type: String
- contextPath: SOCFWConfig.Shadow.contract_version
  description: Version of this output's keys.
  type: Number
- contextPath: SOCFWConfig.Shadow.recorded
  description: True when every changed actor got a config_change row in xsiam_socfw_ir_execution_raw.
  type: Boolean
- contextPath: SOCFWConfig.Status.values
  description: One row per customer value - vendor, arg, value, set, required, used_by.
  type: Unknown
- contextPath: SOCFWConfig.Set.from
  description: The value before the change.
  type: String
- contextPath: SOCFWConfig.Set.to
  description: The value after the change.
  type: String
- contextPath: SOCFWConfig.Set.applied
  description: True when the change was written and read back.
  type: Boolean
- contextPath: SOCFWConfig.Set.dry_run
  description: True when nothing was written.
  type: Boolean
- contextPath: SOCFWConfig.Set.apply_command
  description: The command that writes this change.
  type: String
- contextPath: SOCFWConfig.Set.contract_version
  description: Version of this output's keys.
  type: Number
- contextPath: SOCFWConfig.Status.jobs
  description: One row per framework JOB - job, installed, scheduled, owner, owner_is_user, next_run.
  type: Unknown
- contextPath: SOCFWConfig.Job.job
  description: The JOB changed.
  type: String
- contextPath: SOCFWConfig.Job.from
  description: Owner and schedule before the change.
  type: Unknown
- contextPath: SOCFWConfig.Job.to
  description: Owner and schedule after the change.
  type: Unknown
- contextPath: SOCFWConfig.Job.applied
  description: True when the change was written and read back.
  type: Boolean
- contextPath: SOCFWConfig.Job.dry_run
  description: True when nothing was written.
  type: Boolean
- contextPath: SOCFWConfig.Job.apply_command
  description: The command that writes this change.
  type: String
- contextPath: SOCFWConfig.Job.next_run
  description: When the job runs next, once it is on.
  type: String
- contextPath: SOCFWConfig.Job.recorded
  description: True when the change got a config_change row in xsiam_socfw_ir_execution_raw.
  type: Boolean
- contextPath: SOCFWConfig.Job.contract_version
  description: Version of this output's keys.
  type: Number
- contextPath: SOCFWConfig.Emergency.policies
  description: Every emergency policy - policy, origin (shipped, edited on this tenant,
    this tenant), on, subject, gate, actions with their state for issue_emergency, name_only.
  type: Unknown
- contextPath: SOCFWConfig.Emergency.from
  description: The policy before the change.
  type: Unknown
- contextPath: SOCFWConfig.Emergency.to
  description: The policy after the change, or null when it is removed.
  type: Unknown
- contextPath: SOCFWConfig.Emergency.applied
  description: True when the change was written and read back.
  type: Boolean
- contextPath: SOCFWConfig.Emergency.dry_run
  description: True when nothing was written.
  type: Boolean
- contextPath: SOCFWConfig.Emergency.apply_command
  description: The command that writes this change.
  type: String
- contextPath: SOCFWConfig.Emergency.settings
  description: Which hosts and accounts may be contained - each of protect, containable_hosts,
    containable_roles, role, escalate_severity with where it came from (shipped or this tenant).
  type: Unknown
- contextPath: SOCFWConfig.Emergency.contract_version
  description: Version of this output's keys.
  type: Number
- contextPath: SOCFWConfig.Status.triage
  description: Auto Triage score_threshold and window_hours, each with shipped, tenant, effective
    and from.
  type: Unknown
- contextPath: SOCFWConfig.Triage.settings
  description: score_threshold and window_hours, each with shipped (SOCOptimizationConfig_V3),
    tenant (SOCFWTenantConfig), effective (what Auto Triage uses) and from (shipped or
    tenant).
  type: Unknown
- contextPath: SOCFWConfig.Triage.changes
  description: One row per setting given - setting, from, to, from_source, to_source, changed.
  type: Unknown
- contextPath: SOCFWConfig.Triage.applied
  description: True when the change was written and read back.
  type: Boolean
- contextPath: SOCFWConfig.Triage.dry_run
  description: True when nothing was written.
  type: Boolean
- contextPath: SOCFWConfig.Triage.apply_command
  description: The command that writes this change.
  type: String
- contextPath: SOCFWConfig.Triage.contract_version
  description: Version of this output's keys.
  type: Number
