commonfields:
  id: SOCFWStarCase
  version: -1
name: SOCFWStarCase
script: ''
type: python
subtype: python3
dockerimage: demisto/python3:3.12.8.1983910
comment: Stars the case when the assessment warrants an analyst. The conditions are
  rules in phases.triage.star of SOCFrameworkPhasePolicy_V3, so adding or changing one
  is a list edit rather than a release. Records the decision either way, including when
  a star was warranted but the issue had no case to star yet. Never un-stars.
tags:
- socfw
enabled: true
scripttarget: 0
runonce: false
runas: DBotWeakRole
fromversion: 6.10.0
marketplaces:
- marketplacev2
supportedModules:
- X1
- X3
- X5
system: false
args:
- name: source_key
  description: Context key holding the promoted assessment object. Defaults to Assessment.AI.
  defaultValue: Assessment.AI
- name: case_id
  description: Case id to star. Normally resolved from the issue; set this only to override.
