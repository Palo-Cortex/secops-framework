fromversion: 6.10.0
commonfields:
  id: SOCFWHealthCheck
  version: -1
name: SOCFWHealthCheck
script: '-'
type: python
subtype: python3
dockerimage: demisto/python3:3.12.12.6796194
runas: DBotWeakRole
comment: >-
  Read-only SOC Framework health check for a tenant. Configuration: what
  !SOCFWConfig command=status reports, graded - the tenant config list, the
  mode the tenant matches and what runs for real, required customer values,
  each framework JOB (on or off, and whether its owner is a user; on with an
  owner who is not a user is a FAIL), Auto Triage settings and emergency
  response. Installation: with config_url, every list, integration instance,
  job, lookup dataset, pack and correlation rule named in that
  xsoar_config.json; without it, prefix matching on entry-point playbooks and
  jobs, plus integrations, correlation rules, dashboards and installed packs.
  Changes nothing on the tenant except an optional row in socfw_health_checks
  (write_dataset=true). Run from any incident or as a job.
enabled: true
tags:
  - soc-framework
  - health-check
  - utilities
args:
  - name: config_url
    required: false
    description: >-
      Raw URL of an xsoar_config.json. When given, the installation checks use
      the exact items it names. Without it, prefix matching is used.

  - name: write_dataset
    required: false
    defaultValue: "false"
    auto: PREDEFINED
    predefined:
      - "true"
      - "false"
    description: >-
      Write one row per check to the socfw_health_checks lookup dataset, to
      track health over a PoV.

  - name: core_rest_instance
    required: false
    description: >-
      Core REST API instance to use. Leave empty to use the default.

  - name: entry_point_prefixes
    required: false
    isArray: true
    description: >-
      Without config_url: playbook name prefixes counted as entry points.
      Default EP_IR_NIST, "Foundation - ", "JOB - ".

  - name: job_playbook_prefixes
    required: false
    isArray: true
    description: >-
      Without config_url: playbook name prefixes for framework jobs. Default
      "JOB - ".

  - name: verbose
    required: false
    defaultValue: "false"
    auto: PREDEFINED
    predefined:
      - "true"
      - "false"
    description: >-
      Without config_url: list every matching entry-point playbook, not only
      the count.

outputs:
  - contextPath: SOCFWHealthCheck.version
    description: Version of the health check.
    type: String
  - contextPath: SOCFWHealthCheck.timestamp
    description: UTC time of the run.
    type: Date
  - contextPath: SOCFWHealthCheck.config_url
    description: The config_url used, empty when prefix matching was used.
    type: String
  - contextPath: SOCFWHealthCheck.overall_status
    description: OK, WARN or FAIL - the worst status among the checks.
    type: String
  - contextPath: SOCFWHealthCheck.ok_count
    description: Number of checks that are OK.
    type: Number
  - contextPath: SOCFWHealthCheck.warn_count
    description: Number of checks that are WARN.
    type: Number
  - contextPath: SOCFWHealthCheck.fail_count
    description: Number of checks that are FAIL.
    type: Number
  - contextPath: SOCFWHealthCheck.checks
    description: One object per check, with check, status (OK, WARN or FAIL) and detail.
    type: Unknown
