commonfields:
  id: SOCFWReportMailboxCheck
  version: -1
name: SOCFWReportMailboxCheck
script: ''
type: python
subtype: python3
dockerimage: demisto/python3:3.12.8.1983910
comment: Checks the issue's recipient against the tenant's abuse/report mailboxes,
  set with SOCFWConfig command=mailboxes. Mail delivered to a listed mailbox sets
  SOCFramework.ReportMailbox.skip so the entry playbook does not assess it, and asks
  the Universal Command to close that issue with a note (soc-close-issue-report-mailbox,
  shipped in shadow). The case is never closed. A click is never skipped. With no
  mailboxes listed it does nothing. Records a report_mailbox_decision row when the
  recipient is listed.
tags:
- socfw
enabled: true
scripttarget: 0
runonce: false
runas: DBotWeakRole
fromversion: 6.10.0
marketplaces:
- marketplacev2
supportedModules:
- X1
- X3
- X5
system: false
outputs:
- contextPath: SOCFramework.ReportMailbox.skip
  description: true when the issue is mail delivered to a listed report mailbox and is
    not to be assessed. Not set otherwise.
  type: String
- contextPath: SOCFramework.ReportMailbox.close_notes
  description: The note the close carries, naming the report mailbox.
  type: String
