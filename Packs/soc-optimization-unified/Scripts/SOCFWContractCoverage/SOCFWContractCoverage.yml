    packID: soc-optimization-unified
    packName: SOC Framework Unified
    itemVersion: 3.15.1
    fromServerVersion: 6.10.0
    toServerVersion: ''
    definitionid: ''
    prevname: ''
    isoverridable: false
    supportedModules: []
system: true
