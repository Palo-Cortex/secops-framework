rule_id: 0
fromversion: 6.10.0
tags:
  - SOCFramework
  - Detection
  - Identity
  - EntraID
  - T1078
action: ALERTS
alert_category: User Defined
alert_description: $alert_description
alert_domain: DOMAIN_SECURITY
alert_fields:
  agent_device_domain: domain_part
  action_remote_ip: action_remote_ip
  vendor: vendor_name
  product: product_name
  user_principal: userprincipalname
  userid: userprincipalname
  usersid: userid
  socfwidentityaction: sign_in_action
  socfwidentityapp: appdisplayname
  socfwidentityresource: resourcedisplayname
  socfwidentityrisk: risklevelduringsignin
  socfwidentityriskstate: riskstate
  socfwidentitylocation: location_str
  socfwidentitycondaccess: conditionalaccessstatus
  socfwidentityerrorcode: error_code_str
  socfwidentityfailurereason: failure_reason
  mitretacticid: mitre_tactic_id
  mitretacticname: mitre_tactic
  mitretechniqueid: mitre_ids_str
  mitretechniquename: mitre_ids_str
  actor_effective_username: actor_effective_username
  originalalertid: originalalertid
  originalalertname: originalalertname
  originalalertsource: originalalertsource
  externallink: externallink
  alert_description: alert_description
  severity: severity
  agent_hostname: agent_hostname
  agent_id: agent_id
  action_local_ip: action_local_ip
  username: actor_effective_username
  remoteip: action_remote_ip
  domain: agent_device_domain
  socfwidentityuserdisplayname: idr_display_name
  entra_sign_in_id: entra_sign_in_id
  entra_risk_detail: entra_risk_detail
  entra_risk_events: entra_risk_events
  entra_client_app: entra_client_app
  entra_is_interactive: entra_is_interactive
  entra_user_type: entra_user_type
  entra_asn: entra_asn
  tags: alert_tags
  alert_name: alert_name
alert_name: SOC Identity - $alert_name
alert_type: null
crontab: '*/10 * * * *'
dataset: alerts
name: SOC Identity - Entra ID Suspicious Sign-In
description: >-
  Creates an XSIAM alert for Entra ID sign-in events with risk indicators:
  failed authentication, elevated risk level during sign-in, or an active risk
  state. Canonicalizes the user principal email-first as the identity grouping
  pivot and maps the source IP, application, resource, risk and
  conditional-access context. XSIAM native behavioral identity analytics also
  fire on this data after baseline learning; this rule fires on field values
  immediately.
drilldown_query_timeframe: ALERT
execution_mode: SCHEDULED
global_rule_id: SOC Identity - Entra ID Suspicious Sign-In
investigation_query_link: |-
  dataset = msft_azure_ad_raw
  | filter lowercase(userprincipalname) = $actor_effective_username
  | fields _time, appdisplayname, ipaddress, risklevelduringsignin, riskstate, conditionalaccessstatus, status
is_enabled: true
lookup_mapping: []
mapping_strategy: CUSTOM
mitre_defs: {}
search_window: 20 minutes
severity: User Defined
simple_schedule: 10 minutes
suppression_duration: 1 hours
suppression_enabled: true
suppression_fields:
- correlationid
timezone: null
user_defined_category: alert_category
user_defined_severity: alert_severity
xql_query: |
  dataset = msft_azure_ad_raw
  | alter vendor_name = "Microsoft", product_name = "Entra ID"

  | alter
      error_code     = json_extract_scalar(status, "$.errorCode"),
      failure_reason = json_extract_scalar(status, "$.failureReason")

  | filter (
      error_code != "0"
      or risklevelduringsignin not in ("none", "")
      or riskstate not in ("none", "")
  )

  | filter not (error_code = "0" and risklevelduringsignin = "none" and riskstate = "none")

  | alter
      alert_severity = if(
          risklevelduringsignin = "high", "SEV_050_CRITICAL",
          risklevelduringsignin = "medium", "SEV_040_HIGH",
          error_code != "0", "SEV_030_MEDIUM",
          "SEV_020_LOW"
      ),
      alert_category = "Identity Security",
      sign_in_action = if(
          error_code != "0", "failed_sign_in",
          risklevelduringsignin = "high", "risky_sign_in",
          risklevelduringsignin = "medium", "risky_sign_in",
          "suspicious_sign_in"
      ),
      alert_name = concat(
          "[Identity] ",
          coalesce(userprincipalname, userdisplayname, "Unknown"),
          if(error_code != "0",
              concat(" - Failed Auth (", error_code, ") to ", coalesce(appdisplayname, "Unknown App")),
              concat(" - Risky Sign-In (", coalesce(risklevelduringsignin, "unknown"), ") to ", coalesce(appdisplayname, "Unknown App"))
          )
      ),
      alert_description = concat(
          if(error_code != "0", "Failed authentication", "Risky sign-in detected"),
          " | User: ", coalesce(userprincipalname, "Unknown"),
          " | App: ", coalesce(appdisplayname, "Unknown"),
          " | IP: ", coalesce(ipaddress, "Unknown"),
          " | Risk: ", coalesce(risklevelduringsignin, "none"),
          " | Location: ", coalesce(json_extract_scalar(location, "$.countryOrRegion"), "Unknown")
      )

  | alter location_str = concat(
      coalesce(json_extract_scalar(location, "$.city"), ""),
      ", ",
      coalesce(json_extract_scalar(location, "$.state"), ""),
      ", ",
      coalesce(json_extract_scalar(location, "$.countryOrRegion"), "")
  )

  | alter domain_part = arrayindex(split(userprincipalname, "@"), 1)

  | alter error_code_str = to_string(error_code)

  | alter
      mitre_tactic       = "Initial Access",
      mitre_tactic_id    = "TA0001",
      mitre_technique    = "Valid Accounts",
      mitre_technique_id = "T1078",
      mitre_ids_str      = "T1078 - Valid Accounts"

  | alter
          original_upn = userprincipalname
  | alter
          user_principal = userprincipalname,
          user_name      = lowercase(userprincipalname),
          display_name   = userdisplayname

  | alter
          vendor              = vendor_name,
          product             = product_name,
          originalalertid     = coalesce(correlationid, id),
          originalalertname   = alert_name,
          originalalertsource = "Microsoft Entra ID - Sign-in Logs",
          externallink        = null,
          severity            = if(
              alert_severity = "SEV_050_CRITICAL", "Critical",
              alert_severity = "SEV_040_HIGH",     "High",
              alert_severity = "SEV_030_MEDIUM",   "Medium",
              "Low"),
          agent_hostname      = null,
          agent_id            = null,
          action_local_ip     = null,
          action_remote_ip    = ipaddress,
          actor_effective_username = lowercase(userprincipalname),
    agent_device_domain      = domain_part

  | alter entra_sign_in_id   = id,
          entra_risk_detail  = riskdetail,
          entra_risk_events  = to_string(riskeventtypes_v2),
          entra_client_app   = clientappused,
          entra_is_interactive = isinteractive,
          entra_user_type    = usertype,
          entra_asn          = to_string(autonomoussystemnumber)

  | alter alert_tags = arraycreate("DS:Microsoft/Entra ID", "DOM:Security")

  | alter idr_sid = null,
          idr_upn = user_principal,
          idr_email = if(user_principal contains "@", lowercase(user_principal), if(user_name contains "@", lowercase(user_name), null)),
          idr_netbios = null,
          idr_display_name = null,
          idr_domain_name = null,
          idr_sam_account_name = null,
          idr_on_prem_sid = null

  // ============== CIE ENRICHMENT (optional, OFF by default) ==============
  // Cloud Identity Engine enrichment is disabled. To enable it:
  //   1. Set this rule to a schedule (it ships REAL_TIME):
  //        execution mode = SCHEDULED
  //        crontab        = */10 * * * *
  //        search window  = 20 minutes
  //        schedule label = 10 minutes
  //   2. Delete the /* and */ lines that wrap the block below.
  // The join coalesces socfw_identity_map values OVER the inline idr_* fields;
  // the alert-field mappings do not change. Requires SOC IdentityResolve.
  // ----------------------------------------------------------------------
  /*
  | filter timestamp_diff(time_frame_end(), _insert_time, "MINUTE") <= 15
  | alter cie_join_key = lowercase(coalesce(if(user_principal contains "@", user_principal, null), if(user_name contains "@", user_name, null)))
  | join type = left (
      dataset = socfw_identity_map
      | filter type = "user"
      | alter cie_join_key = lowercase(coalesce(upn, email))
      | dedup cie_join_key by asc netbios_and_sam_account_name
      | fields cie_join_key,
               sid                          as map_sid,
               upn                          as map_upn,
               email                        as map_email,
               display_name                 as map_display,
               domain_name                  as map_domain,
               sam_account_name             as map_sam,
               on_prem_sid                  as map_on_prem_sid,
               netbios_and_sam_account_name as map_netbios,
               title                        as map_title,
               department                   as map_department,
               manager_raw                  as map_manager,
               country                      as map_country,
               company_name                 as map_company,
               location                     as map_location,
               account_status               as map_account_status
    ) as m cie_join_key = m.cie_join_key
  | alter idr_sid              = coalesce(map_sid, idr_sid),
          idr_upn              = coalesce(map_upn, idr_upn),
          idr_email            = coalesce(map_email, idr_email),
          idr_display_name     = coalesce(map_display, idr_display_name),
          idr_domain_name      = coalesce(map_domain, idr_domain_name),
          idr_sam_account_name = coalesce(map_sam, idr_sam_account_name),
          idr_on_prem_sid      = coalesce(map_on_prem_sid, idr_on_prem_sid),
          idr_netbios          = coalesce(map_netbios, idr_netbios),
          idr_title            = map_title,
          idr_department       = map_department,
          idr_manager          = map_manager,
          idr_country          = map_country,
          idr_company          = map_company,
          idr_location         = map_location,
          idr_account_status   = map_account_status
  | alter _time = _insert_time
  */
  // ===================== END CIE ENRICHMENT =============================
  | alter original_display_name   = display_name,
          original_user_principal = user_principal

  | alter display_name   = coalesce(idr_display_name, idr_sam_account_name, display_name),
          email          = idr_email,
          user_principal = coalesce(idr_upn, user_principal)
  | alter actor_effective_username = lowercase(coalesce(idr_email, idr_upn, idr_netbios, actor_effective_username))

  | alter idr_email = coalesce(idr_email, idr_upn, if(user_principal contains "@", lowercase(user_principal), null), if(user_name contains "@", lowercase(user_name), null))
  | alter email     = idr_email

  | alter original_user_name = user_name
  | alter user_name = if(user_name contains "$", user_name, coalesce(idr_email, idr_upn, user_name))
  | fields
      _time, *
