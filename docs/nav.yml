# Site map for the MkDocs site. Hand-curated; this file is the source of
# truth for the ``nav:`` block in mkdocs.yml.
#
# tools/generate_mkdocs_nav.py reads it, expands the placeholders below from
# pack_catalog.json, and writes the result into mkdocs.yml at the
# ``# {{AUTO_NAV}}`` marker in mkdocs.yml.template. Never edit mkdocs.yml.
#
# Placeholders (each must be the only entry on its list line):
#   "{{PACK:<id>}}"       the generated pages of one pack (Overview first,
#                         then its schema pages), inlined at this position.
#   "{{PACKS:vendor}}"    every visible pack without ``tier: foundation`` that
#                         is not placed by a {{PACK:...}} entry, one group each.
#   "{{PACKS:foundation}}" every visible ``tier: foundation`` pack not placed
#                         by a {{PACK:...}} entry, one group each.
#
# Five tabs. Evaluate, Deploy to production and Build on the framework are
# tracks named for what the reader is doing. Reference is one page per
# capability under three headings. Support is symptom first.

- Home: index.md

- Evaluate:
    - evaluate/index.md
    - Install the SOC Framework: evaluate/install.md
    - Install NIST IR AI: evaluate/install-nist-ir-ai.md

- Deploy to production:
    - deploy/index.md

- Build on the framework:
    - build/index.md
    - Architecture:
        - architecture/index.md
        - Alert flow: architecture/alert-flow.md
        - Upon Trigger: architecture/upon-trigger.md
        - Entry points: architecture/entry-points.md
        - Auto Triage: architecture/auto-triage.md
        - NIST IR lifecycle: architecture/nist-ir-lifecycle.md
        - Universal Command and Shadow Mode: architecture/universal-command-shadow-mode.md
        - Value metrics: architecture/value-metrics.md
        - Cross-lifecycle surfaces: architecture/cross-lifecycle-surfaces.md
    - Design notes:
        - Case analysis to containment plan: case-analysis-containment-plan-design.md
    - Contributing:
        - contributing/index.md
        - Editing vendor contracts: contributing/editing-vendor-contracts.md
        - Tooling: contributing/tooling.md

- Reference:
    - reference/index.md
    - SOC Framework:
        - "{{PACK:soc-optimization-unified}}"
        - Universal Command: soc-optimization-unified/universal-command.md
        - Shadow Mode: soc-optimization-unified/shadow-mode.md
        - Tenant Configuration: soc-optimization-unified/tenant-configuration.md
        - Deployment Modes: soc-optimization-unified/deployment-modes.md
    - NIST IR AI:
        - "{{PACK:soc-framework-nist-ir-ai}}"
        - NIST IR AI: soc-framework-nist-ir-ai/nist-ir-ai.md
        - AI Entry Point: soc-framework-nist-ir-ai/entry-point.md
        - Issue Assessment: soc-framework-nist-ir-ai/issue-assessment.md
        - AI Close Decision: soc-framework-nist-ir-ai/close-decision.md
    - Vendor packs:
        - packs/index.md
        - "{{PACKS:vendor}}"
    - Other lifecycle packs:
        - foundation/index.md
        - "{{PACKS:foundation}}"

- Support:
    - support/index.md
    - Read the result surfaces first: diagnosis-read-the-result-surfaces-first.md
