name: JOB - SOC Case Analysis
description: "Runs the NIST IR Detection & Analysis phase once per case, on a schedule, instead of once per issue.\n\nIssue-level automation ends at Foundation - Upon Trigger, which builds the SOC Framework contract and exits. This JOB selects cases with unanalysed issues, collapses each case to its distinct alert shapes and entity sets with a small number of XQL aggregates, and hands one structured payload per case to the AI case analysis prompt.\n\nThe collapse is what makes case scope affordable: a case of N issues reduces to the number of distinct alert shapes, hosts, hashes and addresses it contains, which is bounded by variety rather than by issue count. Aggregates run once across all candidate cases and are partitioned per case in memory.\n\nEnable and disable via the XSIAM Jobs UI. Schedule frequency is the tuning knob; there is no shadow mode inside a JOB."
tags:
- SOC
- SOC_Framework_Unified
- NIST 800-61
- JOB
