    type: regular
    task:
      id: f141c09e-82f8-443d-8e1e-7301763ea48b
      version: -1
      name: Aggregate — issue shapes
      description: Distinct alert shapes per case with occurrence counts and first/last seen. Occurrence count is evidence of intensity, not noise, and first_seen ordering is what carries a cross-category pivot.
      script: '|||xdr-xql-generic-query'
      type: regular
      iscommand: true
      brand: ''
      playbooktaskmissingcomponent:
      istaskmissingcomponenterrordismissed: false
    nexttasks:
      '#none#':
      - '130'
    scriptarguments:
      query:
        simple: "dataset = issues\n| alter incident_id = arrayindex(xdm.issue.case_ids, 0)\n| filter incident_id in (${SOCFramework.Case.CandidateFilter}) and xdm.issue.domain = \"SECURITY\"\n| alter source_tag = arrayindex(original_tags, 0)\n| alter name_parts = split(xdm.issue.name, \" | \")\n| alter shape_key = concat(arrayindex(name_parts, 1), \" | \", arrayindex(name_parts, 2))\n| comp count() as n, min(_time) as first_seen, max(_time) as last_seen,\n       min(xdm.issue.id) as sample_alert_id,\n       values(xdm.issue.id) as candidate_ids,\n       values(xdm.issue.name) as issue_names\n       by incident_id, shape_key, source_tag, xdm.issue.severity,\n          xdm.issue.category, xdm.issue.detection.rule_id\n| sort asc incident_id, desc n"
      query_name:
        simple: socfw_case_shapes
      time_frame:
        simple: ${SOCFramework.Case.Config.CaseWindowHours} hours
    separatecontext: false
    continueonerror: true
    continueonerrortype: ''
