      version: -1
      name: Aggregate — contract coverage
      description: Counts, per case, how many issues ran an entry-point playbook to completion. Only those issues carry a SOC Framework contract. A security case with zero covered issues means the entry point did not fire, which is a coverage gap worth surfacing rather than a case to silently analyse from vendor fields.
      script: '|||xdr-xql-generic-query'
      type: regular
      iscommand: true
      brand: ''
      playbooktaskmissingcomponent:
      istaskmissingcomponenterrordismissed: false
    nexttasks:
